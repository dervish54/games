<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Образ и приключение</title>
<style>
:root{--ink:#263247;--pink:#ff6fae;--purple:#7657e8;--bg1:#fff1f7;--bg2:#e8f4ff;--card:rgba(255,255,255,.9)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(150deg,var(--bg1),var(--bg2));overscroll-behavior:none}body{padding:14px;display:flex;justify-content:center}.app{width:min(920px,100%)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px}.top h1{font-size:clamp(22px,5vw,34px);margin:0}.badge{padding:8px 12px;border-radius:999px;background:#fff;font-weight:800;box-shadow:0 6px 20px #6671a41f;white-space:nowrap}
.card{background:var(--card);border:1px solid #fff;border-radius:24px;padding:16px;box-shadow:0 16px 40px #6671a426;backdrop-filter:blur(8px)}.hidden{display:none!important}
.dress{display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1fr);gap:16px}@media(max-width:650px){.dress{grid-template-columns:1fr}.card{padding:12px}}
.stage{position:relative;min-height:390px;border-radius:20px;overflow:hidden;background:linear-gradient(#c9edff 0 68%,#9add91 68%);display:flex;align-items:flex-end;justify-content:center}.cloud{position:absolute;background:#fff9;border-radius:999px;height:24px}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:35px;height:35px;left:18px;top:-17px}.cloud:after{width:28px;height:28px;left:48px;top:-10px}.c1{width:84px;left:8%;top:14%}.c2{width:105px;right:5%;top:27%}
.character{position:relative;width:180px;height:320px;transform-origin:50% 100%;transition:.25s}.shadow{position:absolute;left:27px;bottom:4px;width:128px;height:18px;border-radius:50%;background:#34435a2d}.head{position:absolute;left:55px;top:34px;width:72px;height:82px;border-radius:45% 45% 48% 48%;background:#f1bd91;z-index:4}.hair{position:absolute;left:49px;top:25px;width:86px;height:48px;border-radius:50% 55% 25% 25%;background:#6b442d;z-index:5}.hair:after{content:"";position:absolute;right:1px;top:24px;width:16px;height:52px;border-radius:10px;background:inherit}.eye{position:absolute;top:35px;width:8px;height:10px;border-radius:50%;background:#263247}.eye.l{left:19px}.eye.r{right:19px}.smile{position:absolute;left:26px;top:55px;width:22px;height:10px;border-bottom:3px solid #b4535a;border-radius:50%}.body{position:absolute;left:43px;top:108px;width:95px;height:115px;border-radius:30px 30px 20px 20px;background:#6c8df3;z-index:3}.arm{position:absolute;top:119px;width:28px;height:105px;border-radius:20px;background:#f1bd91;z-index:2}.arm.l{left:24px;transform:rotate(8deg)}.arm.r{right:21px;transform:rotate(-8deg)}.leg{position:absolute;top:212px;width:34px;height:91px;border-radius:10px 10px 18px 18px;background:#324a78;z-index:2}.leg.l{left:50px}.leg.r{right:48px}.shoe{position:absolute;bottom:10px;width:49px;height:23px;border-radius:18px 18px 8px 8px;background:#303848;z-index:4}.shoe.l{left:38px}.shoe.r{right:35px}.hat,.cape,.belt,.badgeIcon{display:none;position:absolute;z-index:6}.hat{left:39px;top:2px;width:104px;height:48px}.cape{left:34px;top:116px;width:112px;height:138px;z-index:1}.belt{left:43px;top:185px;width:95px;height:16px;background:#3f3541}.badgeIcon{left:79px;top:136px;font-size:24px}.character.pirate .hat{display:block;background:#20263a;border-radius:70% 70% 10px 10px;border-bottom:8px solid #cfb46b}.character.pirate .hat:after{content:"☠";position:absolute;color:white;font-size:25px;left:40px;top:9px}.character.pirate .body{background:#ad2f3a}.character.pirate .belt{display:block}.character.princess .hat{display:block;clip-path:polygon(12% 100%,0 25%,30% 55%,50% 0,70% 55%,100% 25%,88% 100%);background:#ffd552}.character.princess .body{background:#ef77bd;border-radius:36px 36px 8px 8px}.character.princess .body:after{content:"";position:absolute;left:-24px;top:76px;width:142px;height:91px;background:inherit;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}.character.hero .cape{display:block;background:#d84155;clip-path:polygon(0 0,100% 0,87% 100%,50% 83%,13% 100%)}.character.hero .body{background:#316bd9}.character.hero .badgeIcon{display:block}.character.hero .badgeIcon:after{content:"★";color:#ffd54e}.character.astronaut .hat{display:block;left:41px;top:13px;width:100px;height:108px;border:12px solid #eef3fa;border-radius:50%;background:#7fc7ed88;z-index:7}.character.astronaut .body{background:#eef3fa;border:3px solid #b9c8d9}.character.astronaut .leg{background:#dce7f2}.character.wizard .hat{display:block;top:-26px;left:44px;width:94px;height:96px;background:#5b47a6;clip-path:polygon(50% 0,89% 80%,100% 100%,0 100%,14% 80%)}.character.wizard .hat:after{content:"✦";position:absolute;color:#ffd65b;font-size:27px;left:40px;top:41px}.character.wizard .body{background:#6f59be}.character.ninja .hair{background:#232836;width:88px;height:84px;top:24px}.character.ninja .head{background:#d7a47d;height:43px;top:55px}.character.ninja .body{background:#252a36}.character.ninja .leg{background:#252a36}.character.red .body{background:#e84f5f}.character.blue .body{background:#4387e6}.character.green .body{background:#46a66d}.character.purple .body{background:#875bd3}.character.black .body{background:#343946}.character.yellow .body{background:#e7bb3f}
.panel h2{margin:2px 0 8px}.hint{font-size:14px;color:#647087;line-height:1.45}.speech{margin:12px 0;padding:12px;border-radius:16px;background:#f3f5fa;min-height:54px;font-weight:700}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:16px;min-height:52px;padding:10px 14px;font-size:16px;font-weight:800;cursor:pointer}.mic{grid-column:1/-1;background:linear-gradient(135deg,var(--purple),#a363ea);color:white;font-size:20px}.mic.listening{animation:pulse .8s infinite alternate}.yes{background:#3db974;color:white}.no{background:#edf0f5;color:#4d5870}.start{grid-column:1/-1;background:linear-gradient(135deg,#ff6fae,#ff9a6b);color:#fff}.inputrow{display:flex;gap:8px;margin-top:10px}.inputrow input{flex:1;min-width:0;border:2px solid #dde3ec;border-radius:14px;padding:12px;font-size:16px}.inputrow button{border:0;border-radius:14px;padding:0 14px;font-weight:800;background:#e8e3ff;color:#5747a6}@keyframes pulse{to{transform:scale(1.025);box-shadow:0 0 0 8px #7657e821}}
.levels{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.leveldot{padding:7px 10px;border-radius:12px;background:#edf0f5;font-size:13px;font-weight:800}.leveldot.done{background:#d9f4df;color:#27743a}.leveldot.active{background:#e7e0ff;color:#5a42b8}
.gamewrap{position:relative;border-radius:22px;overflow:hidden;background:#dff5ff;touch-action:none}.gamehud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}.gamehud span{background:#ffffffdd;border-radius:999px;padding:7px 10px;font-weight:900}canvas{width:100%;height:auto;display:block;aspect-ratio:4/5;max-height:76vh}.overlay{position:absolute;inset:0;background:#24334fb5;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.box{background:white;border-radius:22px;padding:20px;text-align:center;max-width:340px}.box h2{margin-top:0}.box .btn{width:100%;background:var(--purple);color:white}
</style>
</head>
<body>
<div class="app">
 <div class="top"><h1>✨ Образ и приключение</h1><div class="badge" id="modeBadge">Гримерная</div></div>
 <section class="card" id="dressScreen">
  <div class="dress">
   <div class="stage"><div class="cloud c1"></div><div class="cloud c2"></div><div class="character" id="character"><div class="shadow"></div><div class="cape"></div><div class="leg l"></div><div class="leg r"></div><div class="shoe l"></div><div class="shoe r"></div><div class="arm l"></div><div class="arm r"></div><div class="body"></div><div class="belt"></div><div class="badgeIcon"></div><div class="head"><div class="eye l"></div><div class="eye r"></div><div class="smile"></div></div><div class="hair"></div><div class="hat"></div></div></div>
   <div class="panel">
    <h2>Какой образ ты хочешь?</h2>
    <div class="hint">Нажми микрофон и скажи, например: «Хочу быть пиратом в красном», «космонавтом», «волшебником в фиолетовом» или «ниндзя».</div>
    <div class="speech" id="speech">Твой образ пока обычный 🙂</div>
    <div class="controls">
      <button class="btn mic" id="mic">🎤 Сказать образ</button>
      <button class="btn yes" id="yes" disabled>✓ Сделано</button>
      <button class="btn no" id="no" disabled>✕ Нет</button>
      <button class="btn start hidden" id="start">Играть в этом образе →</button>
    </div>
    <div class="inputrow"><input id="manual" placeholder="Или напиши образ здесь"><button id="apply">Примерить</button></div>
    <div class="levels" id="levels"></div>
   </div>
  </div>
 </section>
 <section class="card hidden" id="gameScreen">
  <div class="gamewrap" id="gameWrap">
   <canvas id="game" width="600" height="750"></canvas>
   <div class="gamehud"><span id="levelText">Уровень 1</span><span id="starsText">⭐ 0 / 5</span></div>
   <div class="overlay" id="gameOverlay"><div class="box"><h2 id="overTitle">Готов?</h2><p id="overText">Собери звёзды и не задень препятствия.</p><button class="btn" id="overButton">Начать</button></div></div>
  </div>
 </section>
</div>
<script>
(()=>{
const char=document.getElementById('character'),speech=document.getElementById('speech'),mic=document.getElementById('mic'),yes=document.getElementById('yes'),no=document.getElementById('no'),start=document.getElementById('start'),manual=document.getElementById('manual'),apply=document.getElementById('apply'),levels=document.getElementById('levels'),dressScreen=document.getElementById('dressScreen'),gameScreen=document.getElementById('gameScreen'),badge=document.getElementById('modeBadge');
let accepted='',preview='',level=1,maxLevel=5;
function drawLevels(){levels.innerHTML='';for(let i=1;i<=maxLevel;i++){let d=document.createElement('div');d.className='leveldot'+(i<level?' done':i===level?' active':'');d.textContent=(i<level?'✓ ':i===level?'▶ ':'🔒 ')+ 'Ур. '+i;levels.appendChild(d)}}drawLevels();
function parseLook(text){let s=(text||'').toLowerCase(),cls=[];if(/пират/.test(s))cls.push('pirate');else if(/принцесс|королев/.test(s))cls.push('princess');else if(/супер|геро/.test(s))cls.push('hero');else if(/космонав|астронав/.test(s))cls.push('astronaut');else if(/волшеб|маг|чарод/.test(s))cls.push('wizard');else if(/ниндз/.test(s))cls.push('ninja');
 if(/красн/.test(s))cls.push('red');else if(/син|голуб/.test(s))cls.push('blue');else if(/зел[её]н/.test(s))cls.push('green');else if(/фиолет|сирен/.test(s))cls.push('purple');else if(/ч[её]рн/.test(s))cls.push('black');else if(/ж[её]лт|золот/.test(s))cls.push('yellow');return cls.join(' ') || 'hero';}
function setLook(text){preview=parseLook(text);char.className='character '+preview;speech.textContent='Я услышал: «'+text+'». Нравится этот образ?';yes.disabled=false;no.disabled=false;start.classList.add('hidden')}
apply.addEventListener('click',()=>{let v=manual.value.trim();if(v)setLook(v)});manual.addEventListener('keydown',e=>{if(e.key==='Enter')apply.click()});
yes.addEventListener('click',()=>{accepted=preview;speech.textContent='Отлично! Образ сохранён ✨';yes.disabled=true;no.disabled=true;start.classList.remove('hidden')});
no.addEventListener('click',()=>{preview=accepted;char.className='character '+accepted;speech.textContent=accepted?'Вернул предыдущий образ. Попробуй другой!':'Образ убран. Скажи, какой хочешь попробовать.';yes.disabled=true;no.disabled=true});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;if(SR){rec=new SR();rec.lang='ru-RU';rec.interimResults=false;rec.maxAlternatives=1;rec.onstart=()=>{mic.classList.add('listening');mic.textContent='🎙️ Слушаю...'};rec.onend=()=>{mic.classList.remove('listening');mic.textContent='🎤 Сказать образ'};rec.onresult=e=>{let t=e.results[0][0].transcript;manual.value=t;setLook(t)};rec.onerror=e=>{speech.textContent='Не получилось услышать. Можно написать образ в поле ниже.'}}else{speech.textContent='В этом браузере распознавание речи недоступно. Напиши образ в поле ниже.'}
mic.addEventListener('click',()=>{if(rec){try{rec.start()}catch(e){}}else manual.focus()});
start.addEventListener('click',()=>{dressScreen.classList.add('hidden');gameScreen.classList.remove('hidden');badge.textContent='Уровень '+level;resetLevel(true)});
// GAME
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),levelText=document.getElementById('levelText'),starsText=document.getElementById('starsText'),overlay=document.getElementById('gameOverlay'),overTitle=document.getElementById('overTitle'),overText=document.getElementById('overText'),overButton=document.getElementById('overButton');let player,stars,rocks,got,running=false,last=0,raf=0,inv=0;
function resetLevel(first){player={x:300,y:650,r:27,targetX:300,targetY:650,hp:3};stars=[];rocks=[];got=0;inv=0;levelText.textContent='Уровень '+level;starsText.textContent='⭐ 0 / '+(4+level);overTitle.textContent=first?'Уровень '+level:'Ещё раз?';overText.textContent='Собери '+(4+level)+' звёзд. Чем выше уровень, тем быстрее и больше препятствий.';overButton.textContent='Начать';overlay.classList.remove('hidden');running=false;drawGame()}
function begin(){overlay.classList.add('hidden');running=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}overButton.addEventListener('click',begin);
function point(e){let r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;player.targetX=(p.clientX-r.left)/r.width*canvas.width;player.targetY=(p.clientY-r.top)/r.height*canvas.height}canvas.addEventListener('pointerdown',point);canvas.addEventListener('pointermove',e=>{if(e.buttons)point(e)});canvas.addEventListener('touchmove',e=>{point(e);e.preventDefault()},{passive:false});
function spawnStar(){stars.push({x:35+Math.random()*530,y:-25,r:15,vy:85+level*18,spin:Math.random()*6})}function spawnRock(){rocks.push({x:35+Math.random()*530,y:-35,r:22+Math.random()*15,vy:105+level*30,rot:Math.random()*6})}
let st=0,rt=0;function loop(t){if(!running)return;let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);drawGame();raf=requestAnimationFrame(loop)}
function update(dt){let dx=player.targetX-player.x,dy=player.targetY-player.y,d=Math.hypot(dx,dy),speed=360;if(d>4){player.x+=dx/d*Math.min(d,speed*dt);player.y+=dy/d*Math.min(d,speed*dt)}player.x=Math.max(28,Math.min(572,player.x));player.y=Math.max(55,Math.min(720,player.y));if(inv>0)inv-=dt;st-=dt;rt-=dt;if(st<=0){spawnStar();st=.75+Math.random()*.55}if(rt<=0){spawnRock();rt=Math.max(.32,1.35-level*.15)+Math.random()*.45}
 for(let i=stars.length-1;i>=0;i--){let s=stars[i];s.y+=s.vy*dt;s.spin+=dt*3;if(Math.hypot(s.x-player.x,s.y-player.y)<s.r+player.r){stars.splice(i,1);got++;starsText.textContent='⭐ '+got+' / '+(4+level);if(got>=4+level)return win()}else if(s.y>790)stars.splice(i,1)}for(let i=rocks.length-1;i>=0;i--){let r=rocks[i];r.y+=r.vy*dt;r.rot+=dt;if(Math.hypot(r.x-player.x,r.y-player.y)<r.r+player.r*.8&&inv<=0){rocks.splice(i,1);player.hp--;inv=1;if(player.hp<=0)return lose()}else if(r.y>800)rocks.splice(i,1)}}
function win(){running=false;if(level<maxLevel){level++;badge.textContent='Уровень '+level;drawLevels();overTitle.textContent='Уровень пройден! ⭐';overText.textContent='Следующий будет сложнее: препятствия станут быстрее.';overButton.textContent='Уровень '+level;overlay.classList.remove('hidden');resetForNext()}else{overTitle.textContent='Ты прошёл всю игру! 🏆';overText.textContent='Твой образ выдержал все испытания.';overButton.textContent='Вернуться в гримёрную';overlay.classList.remove('hidden');overButton.onclick=()=>location.reload()}}
function resetForNext(){player={x:300,y:650,r:27,targetX:300,targetY:650,hp:3};stars=[];rocks=[];got=0;st=0;rt=.5;levelText.textContent='Уровень '+level;starsText.textContent='⭐ 0 / '+(4+level)}function lose(){running=false;overTitle.textContent='Ой! Попробуем ещё?';overText.textContent='У тебя закончились сердечки.';overButton.textContent='Повторить уровень';overlay.classList.remove('hidden');resetForNext()}
function drawStar(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle='#ffd747';ctx.strokeStyle='#e6aa22';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawPlayer(){let x=player.x,y=player.y;ctx.save();if(inv>0&&Math.floor(inv*10)%2)ctx.globalAlpha=.35;ctx.translate(x,y);ctx.fillStyle='#f1bd91';ctx.beginPath();ctx.arc(0,-13,20,0,Math.PI*2);ctx.fill();ctx.fillStyle=accepted.includes('red')?'#e84f5f':accepted.includes('green')?'#46a66d':accepted.includes('purple')?'#875bd3':accepted.includes('black')?'#343946':accepted.includes('yellow')?'#e7bb3f':'#4387e6';if(accepted.includes('pirate'))ctx.fillStyle='#ad2f3a';if(accepted.includes('wizard'))ctx.fillStyle='#6f59be';if(accepted.includes('ninja'))ctx.fillStyle='#252a36';ctx.fillRect(-21,6,42,43);if(accepted.includes('princess')){ctx.beginPath();ctx.moveTo(-21,18);ctx.lineTo(-35,55);ctx.lineTo(35,55);ctx.lineTo(21,18);ctx.fill()}if(accepted.includes('hero')){ctx.fillStyle='#d84155';ctx.beginPath();ctx.moveTo(-20,8);ctx.lineTo(-34,54);ctx.lineTo(0,42);ctx.lineTo(34,54);ctx.lineTo(20,8);ctx.closePath();ctx.fill()}if(accepted.includes('astronaut')){ctx.strokeStyle='#eef3fa';ctx.lineWidth=10;ctx.beginPath();ctx.arc(0,-13,28,0,Math.PI*2);ctx.stroke()}if(accepted.includes('pirate')){ctx.fillStyle='#20263a';ctx.fillRect(-28,-38,56,12);ctx.beginPath();ctx.arc(0,-37,23,Math.PI,0);ctx.fill()}if(accepted.includes('wizard')){ctx.fillStyle='#5b47a6';ctx.beginPath();ctx.moveTo(0,-70);ctx.lineTo(-28,-30);ctx.lineTo(28,-30);ctx.closePath();ctx.fill()}ctx.fillStyle='#31415f';ctx.fillRect(-19,49,15,24);ctx.fillRect(4,49,15,24);ctx.restore()}
function drawGame(){let g=ctx.createLinearGradient(0,0,0,750);g.addColorStop(0,'#bdeaff');g.addColorStop(1,'#eef8d4');ctx.fillStyle=g;ctx.fillRect(0,0,600,750);ctx.fillStyle='#ffffff77';for(let i=0;i<7;i++){ctx.beginPath();ctx.arc((i*103+40)%600,80+i*75,18+(i%3)*7,0,Math.PI*2);ctx.fill()}for(const s of stars)drawStar(s.x,s.y,s.r,s.spin);for(const r of rocks){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);ctx.fillStyle='#6d7483';ctx.strokeStyle='#4d5565';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-r.r*.8,-r.r*.6);ctx.lineTo(r.r*.45,-r.r);ctx.lineTo(r.r,r.r*.1);ctx.lineTo(r.r*.35,r.r);ctx.lineTo(-r.r*.8,r.r*.6);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}drawPlayer();ctx.font='28px system-ui';ctx.fillText('❤️'.repeat(player?player.hp:3),16,730)}
resetForNext();drawGame();
})();
</script>
</body>
</html>
