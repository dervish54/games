<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Наряди Венома</title><style>html,body{margin:0;min-height:100%;background:linear-gradient(#151922,#080a0d);font-family:Arial,sans-serif;color:#fff}*{box-sizing:border-box}body{display:flex;justify-content:center}.game{width:min(100%,760px);padding:14px 14px 24px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{background:#ffffff14;border:1px solid #ffffff35;padding:8px 12px;border-radius:16px;font-weight:800}.stage{position:relative;height:390px;margin:12px 0;border-radius:26px;background:radial-gradient(circle at 50% 30%,#243244,#10151d 60%,#090b0f);overflow:hidden;border:2px solid #343b47}.venom{position:absolute;left:50%;bottom:34px;width:190px;height:310px;transform:translateX(-50%)}.head{position:absolute;left:50%;top:8px;width:112px;height:104px;transform:translateX(-50%);border-radius:48% 48% 44% 44%;background:#070707;border:3px solid #292929;z-index:5}.eye{position:absolute;top:26px;width:38px;height:17px;background:#fff;clip-path:polygon(0 0,100% 24%,58% 100%)}.e1{left:10px}.e2{right:10px;transform:scaleX(-1)}.mouth{position:absolute;left:16px;right:16px;bottom:14px;height:30px;border-bottom:7px solid #fff;border-radius:50%}.fang{position:absolute;bottom:8px;width:10px;height:23px;background:#fff;clip-path:polygon(0 0,100% 0,50% 100%)}.f1{left:26px}.f2{left:47px}.f3{right:47px}.f4{right:26px}.body{position:absolute;left:50%;top:96px;width:112px;height:132px;transform:translateX(-50%);background:#050505;border-radius:36px 36px 18px 18px}.arm{position:absolute;top:110px;width:32px;height:112px;background:#050505;border-radius:20px}.a1{left:24px;transform:rotate(8deg)}.a2{right:24px;transform:rotate(-8deg)}.leg{position:absolute;top:218px;width:42px;height:74px;background:#050505;border-radius:16px}.l1{left:48px}.l2{right:48px}.topwear,.pants,.suit{position:absolute;z-index:6}.topwear{left:50%;top:104px;width:124px;height:104px;transform:translateX(-50%);border-radius:26px 26px 12px 12px}.pants{left:50%;top:202px;width:112px;height:83px;transform:translateX(-50%);border-radius:8px 8px 18px 18px}.pants:before,.pants:after{content:'';position:absolute;bottom:-38px;width:46px;height:52px;background:inherit;border-radius:0 0 16px 16px}.pants:before{left:5px}.pants:after{right:5px}.suit{left:50%;top:100px;width:138px;height:184px;transform:translateX(-50%);border-radius:28px 28px 18px 18px}.symbol{position:absolute;left:50%;top:144px;transform:translateX(-50%);z-index:7;font-size:48px;filter:grayscale(1) brightness(3)}.fangBtn{position:absolute;border:0;background:transparent;font-size:48px;z-index:20;animation:pop 1.8s ease-in-out infinite;touch-action:manipulation;filter:drop-shadow(0 4px 3px #000)}@keyframes pop{0%,100%{transform:scale(.85) rotate(-6deg)}50%{transform:scale(1.12) rotate(7deg)}}.giftpop{position:absolute;left:50%;top:86px;transform:translateX(-50%) scale(0);font-size:78px;z-index:30;transition:.25s}.giftpop.show{transform:translateX(-50%) scale(1)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.tabs button,.done,.again{border:0;border-radius:15px;padding:11px 6px;font-size:15px;font-weight:800;background:#f3f3f3;color:#111}.tabs button.active{background:#d9ff45}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.opt{min-height:76px;border:3px solid transparent;border-radius:18px;background:#fff;color:#111;font-size:28px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center}.opt span{font-size:12px;margin-top:4px}.opt.sel{border-color:#d9ff45;background:#f7ffd7}.done{width:100%;margin-top:12px;background:#d9ff45;font-size:19px;padding:14px}.playHud{display:none;gap:8px;margin-top:10px}.playHud .pill{flex:1;text-align:center}.message{text-align:center;font-weight:800;min-height:24px;margin-top:8px}.gifts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}.gift{background:#ffffff12;border:1px solid #ffffff25;border-radius:14px;padding:8px 10px;font-size:24px}.hidden{display:none!important}@media(max-width:430px){.stage{height:350px}.venom{transform:translateX(-50%) scale(.9);transform-origin:bottom center}.tabs button{font-size:13px;padding:10px 3px}}</style></head><body><div class="game"><div class="top"><div class="pill">🕷️ Наряди Венома</div><div class="pill">🎁 Подарков: <span id="giftCount">0</span></div></div><div class="stage" id="stage"><div class="venom"><div class="head"><div class="eye e1"></div><div class="eye e2"></div><div class="mouth"></div><div class="fang f1"></div><div class="fang f2"></div><div class="fang f3"></div><div class="fang f4"></div></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div><div class="suit" id="suit"></div><div class="topwear" id="topwear"></div><div class="pants" id="pants"></div><div class="symbol">🕷️</div></div><div class="giftpop" id="giftpop">🎁</div></div><div id="dressUI"><div class="tabs"><button data-tab="suits" class="active">Костюмы</button><button data-tab="tops">Майки</button><button data-tab="pants">Штаны</button></div><div class="options" id="options"></div><button class="done" id="done">🦷 ГОТОВО — ЛОВИТЬ КЛЫКИ</button></div><div class="playHud" id="playHud"><div class="pill">🦷 <span id="fangs">0</span></div><div class="pill">⏱ <span id="time">20</span> сек</div><div class="pill">До подарка: <span id="nextGift">5</span></div></div><div class="message" id="message"></div><div class="gifts" id="gifts"></div><button class="again hidden" id="again">👕 Нарядить заново</button></div><script>(()=>{const stage=document.getElementById('stage'),opts=document.getElementById('options'),dressUI=document.getElementById('dressUI'),playHud=document.getElementById('playHud'),suit=document.getElementById('suit'),topwear=document.getElementById('topwear'),pantsEl=document.getElementById('pants'),message=document.getElementById('message'),giftsEl=document.getElementById('gifts'),giftpop=document.getElementById('giftpop');const items={suits:[['🖤','Чёрный','#111'],['💜','Фиолетовый','#56346f'],['❤️','Красный','#7d1d24']],tops:[['⚪','Белая','#f2f2f2'],['💚','Зелёная','#5fa55b'],['💙','Синяя','#3f70bb']],pants:[['👖','Джинсы','#456b9b'],['🖤','Чёрные','#232323'],['🟥','Красные','#8b2d2d']]};let tab='suits',sel={suits:0,tops:0,pants:0},usingSuit=true,fangs=0,time=20,playing=false,timer=null,spawner=null,giftCount=0;const giftList=['🍗','🎮','🏆','⚡','🛡️','🎁','💎','👑'];function apply(){suit.style.display=usingSuit?'block':'none';topwear.style.display=usingSuit?'none':'block';pantsEl.style.display=usingSuit?'none':'block';if(usingSuit){suit.style.background=items.suits[sel.suits][2]}else{topwear.style.background=items.tops[sel.tops][2];pantsEl.style.background=items.pants[sel.pants][2]}}function render(){opts.innerHTML='';items[tab].forEach((it,i)=>{const b=document.createElement('button');b.className='opt '+(sel[tab]===i?'sel':'');b.innerHTML=`<b>${it[0]}</b><span>${it[1]}</span>`;b.onclick=()=>{sel[tab]=i;if(tab==='suits')usingSuit=true;else usingSuit=false;apply();render()};opts.appendChild(b)})}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});function spawnFang(){if(!playing)return;const f=document.createElement('button');f.className='fangBtn';f.textContent='🦷';f.style.left=(6+Math.random()*82)+'%';f.style.top=(95+Math.random()*220)+'px';let got=false;f.onpointerdown=e=>{e.preventDefault();if(got||!playing)return;got=true;fangs++;document.getElementById('fangs').textContent=fangs;document.getElementById('nextGift').textContent=5-(fangs%5||5);f.remove();if(fangs%5===0)giveGift()};stage.appendChild(f);setTimeout(()=>f.remove(),1800)}function giveGift(){giftCount++;document.getElementById('giftCount').textContent=giftCount;const gift=giftList[Math.floor(Math.random()*giftList.length)];giftpop.textContent=gift;giftpop.classList.add('show');setTimeout(()=>giftpop.classList.remove('show'),900);const g=document.createElement('div');g.className='gift';g.textContent=gift;giftsEl.appendChild(g);message.textContent='Подарок для Венома! '+gift}function start(){dressUI.classList.add('hidden');playHud.style.display='flex';document.getElementById('again').classList.add('hidden');fangs=0;time=20;playing=true;document.getElementById('fangs').textContent='0';document.getElementById('time').textContent=time;document.getElementById('nextGift').textContent='5';message.textContent='Тапай по острым клыкам! Каждые 5 клыков — подарок 🎁';spawner=setInterval(spawnFang,470);timer=setInterval(()=>{time--;document.getElementById('time').textContent=time;if(time<=0)finish()},1000)}function finish(){playing=false;clearInterval(spawner);clearInterval(timer);stage.querySelectorAll('.fangBtn').forEach(f=>f.remove());message.textContent=`Готово! Ты поймал ${fangs} клыков и получил ${Math.floor(fangs/5)} подарков.`;document.getElementById('again').classList.remove('hidden')}document.getElementById('done').onclick=start;document.getElementById('again').onclick=()=>{dressUI.classList.remove('hidden');playHud.style.display='none';document.getElementById('again').classList.add('hidden');message.textContent='';giftsEl.innerHTML=''};apply();render()})();</script></body></html>
