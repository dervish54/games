<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Race Simulator</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#151515;font-family:Arial,sans-serif;touch-action:none;color:#fff}#game{position:relative;width:100%;height:100%;background:linear-gradient(#73b9ff 0 18%,#5d9b47 18% 100%)}canvas{position:absolute;inset:0;width:100%;height:100%}#hud{position:absolute;z-index:4;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-weight:800;text-shadow:0 2px 3px #000}.controls{position:absolute;z-index:5;bottom:18px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end}.pad{display:flex;gap:10px}.btn{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,255,.65);background:rgba(0,0,0,.45);color:#fff;font-size:30px;font-weight:900}.gas{width:88px;height:88px;background:rgba(215,48,48,.72)}#msg{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:34px;font-weight:900;text-align:center;text-shadow:0 3px 7px #000}.panel{position:absolute;inset:0;display:none;z-index:10;align-items:center;justify-content:center;background:rgba(0,0,0,.72)}.card{background:#202020;padding:24px;border-radius:20px;text-align:center;border:2px solid #555}.card button{font-size:18px;padding:12px 18px;border:0;border-radius:12px;background:#ffe14c;font-weight:800}</style></head><body><div id="game"><canvas id="c"></canvas><div id="hud"><span>Круг: <b id="lap">1/3</b></span><span>Место: <b id="place">1/4</b></span><span>Скорость: <b id="speed">0</b></span></div><div id="msg">3</div><div class="controls"><div class="pad"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><button class="btn gas" id="gas">▲</button></div><div class="panel" id="panel"><div class="card"><h2 id="finishTitle">Финиш!</h2><p id="finishText"></p><button id="restart">Ещё гонка</button></div></div></div><script>(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d'),lapEl=document.getElementById('lap'),placeEl=document.getElementById('place'),speedEl=document.getElementById('speed'),msg=document.getElementById('msg'),panel=document.getElementById('panel'),finishTitle=document.getElementById('finishTitle'),finishText=document.getElementById('finishText');let W,H,DPR;function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}resize();addEventListener('resize',resize);const input={l:false,r:false,g:false};for(const [id,k] of [['left','l'],['right','r'],['gas','g']]){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();input[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>input[k]=false))}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')input.l=true;if(e.key==='ArrowRight')input.r=true;if(e.key==='ArrowUp'||e.key===' ')input.g=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')input.l=false;if(e.key==='ArrowRight')input.r=false;if(e.key==='ArrowUp'||e.key===' ')input.g=false});let car,rivals,roadY,scroll,lap,startAt,last,running,finished;function reset(){car={x:.5,vx:0,speed:0,progress:0};rivals=[{x:.34,speed:3.6,p:0.18,c:'#ffcc31'},{x:.62,speed:3.3,p:0.34,c:'#52a7ff'},{x:.47,speed:3.8,p:0.52,c:'#7ce35f'}];scroll=0;lap=1;running=false;finished=false;panel.style.display='none';startAt=performance.now()+3200;last=performance.now();requestAnimationFrame(loop)}function roadCenter(y){return W*.5+Math.sin((scroll+y)*.004)*W*.11+Math.sin((scroll+y)*.009)*W*.035}function roadHalf(y){return W*(.29+(1-y/H)*.06)}function drawRoad(){ctx.fillStyle='#5d9b47';ctx.fillRect(0,0,W,H);for(let y=0;y<H;y+=5){const cy=roadCenter(y),hw=roadHalf(y);ctx.fillStyle='#424242';ctx.fillRect(cy-hw,y,hw*2,6);ctx.fillStyle='#f0f0f0';ctx.fillRect(cy-hw-5,y,5,6);ctx.fillRect(cy+hw,y,5,6);if(((scroll+y)/42|0)%2===0){ctx.fillStyle='#fff';ctx.fillRect(cy-4,y,8,24)}}}function drawCar(px,py,col,scale=1){ctx.save();ctx.translate(px,py);ctx.scale(scale,scale);ctx.fillStyle=col;ctx.fillRect(-18,-34,36,68);ctx.fillStyle='#151515';ctx.fillRect(-13,-20,26,20);ctx.fillStyle='#9fe7ff';ctx.fillRect(-11,-18,22,16);ctx.fillStyle='#111';ctx.fillRect(-22,-20,7,18);ctx.fillRect(15,-20,7,18);ctx.fillRect(-22,10,7,18);ctx.fillRect(15,10,7,18);ctx.fillStyle='#ffef64';ctx.fillRect(-13,-31,8,6);ctx.fillRect(5,-31,8,6);ctx.restore()}function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;const remain=(startAt-t)/1000;if(!running&&!finished){msg.textContent=remain>2?3:remain>1?2:remain>0?1:'СТАРТ!';if(remain<=0){running=true;setTimeout(()=>msg.textContent='',700)}}if(running){const accel=input.g?4.5:-2.2;car.speed=Math.max(0,Math.min(6.5,car.speed+accel*dt));if(input.l)car.vx-=1.9*dt;if(input.r)car.vx+=1.9*dt;car.vx*=Math.pow(.2,dt);car.x+=car.vx*dt;car.x=Math.max(.18,Math.min(.82,car.x));scroll+=car.speed*115*dt;car.progress+=car.speed*dt*.018;if(car.progress>=1){car.progress-=1;lap++;if(lap>3){finished=true;running=false}}for(const r of rivals){r.p+=r.speed*dt*.018;if(r.p>=1)r.p-=1;r.x+=Math.sin(t*.001+r.p*7)*.0008}if(finished){const standings=[{me:true,p:3+car.progress},...rivals.map(r=>({p:2+r.p+Math.random()*.02}))].sort((a,b)=>b.p-a.p);const pos=standings.findIndex(s=>s.me)+1;finishTitle.textContent=pos===1?'Победа! 🏆':'Финиш!';finishText.textContent='Ты занял '+pos+' место';panel.style.display='flex'}lapEl.textContent=Math.min(lap,3)+'/3';speedEl.textContent=Math.round(car.speed*42)+' км/ч';const myTotal=(lap-1)+car.progress;let ahead=0;for(const r of rivals){if((lap-1)+r.p>myTotal)ahead++}placeEl.textContent=(ahead+1)+'/4'}drawRoad();const py=H*.75,cx=roadCenter(py),hw=roadHalf(py),px=cx+(car.x-.5)*hw*2;drawCar(px,py,'#e53935',1.15);for(const r of rivals){const ry=H*(.28+.48*((1-r.p+car.progress+1)%1)),rc=roadCenter(ry),rhw=roadHalf(ry),rx=rc+(r.x-.5)*rhw*2;drawCar(rx,ry,r.c,.85)}requestAnimationFrame(loop)}document.getElementById('restart').onclick=reset;reset()})();</script></body></html>
