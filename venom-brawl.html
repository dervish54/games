<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>VENOM: Ночной бой</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}
  #wrap{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#17202d 0,#080b11 42%,#020305 100%)}
  canvas{width:100vw;height:100vh;display:block}
  #hud{position:fixed;left:0;right:0;top:0;padding:10px 12px;pointer-events:none;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;text-shadow:0 2px 3px #000;font-weight:800}
  .panel{background:#05070bc9;border:1px solid #ffffff22;border-radius:14px;padding:9px 11px;backdrop-filter:blur(5px);min-width:220px;box-shadow:0 8px 24px #0008}
  .label{font-size:12px;opacity:.75;letter-spacing:.08em}.row{display:flex;align-items:center;gap:8px}.bar{height:12px;background:#ffffff16;border:1px solid #ffffff28;border-radius:99px;overflow:hidden;flex:1}.fill{height:100%;width:100%;background:linear-gradient(90deg,#fff,#bfc7d6)}#symFill{background:linear-gradient(90deg,#646cff,#b78cff)}
  #centerMsg{position:fixed;top:17%;left:50%;transform:translateX(-50%);font-weight:1000;font-size:clamp(22px,5vw,48px);letter-spacing:.03em;text-align:center;text-shadow:0 4px 12px #000;pointer-events:none;opacity:0;transition:opacity .25s}
  #controls{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;gap:18px}
  .cluster{display:flex;gap:10px;align-items:flex-end}.btn{width:68px;height:68px;border-radius:50%;border:1px solid #ffffff44;background:#0b0f17cc;color:#fff;font-size:24px;font-weight:900;box-shadow:0 6px 18px #0009;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:none}.btn.big{width:78px;height:78px}.btn:active,.btn.on{transform:scale(.94);background:#232a38}.smalltxt{font-size:10px;line-height:1;text-align:center;display:block}.icon{font-size:25px;line-height:1;display:block}
  #start{position:fixed;inset:0;background:linear-gradient(#05070bd9,#05070bf2);display:grid;place-items:center;padding:24px;z-index:4}.card{max-width:620px;text-align:center;background:#0a0e16e8;border:1px solid #ffffff25;border-radius:24px;padding:26px;box-shadow:0 24px 70px #000}.card h1{margin:0 0 6px;font-size:clamp(34px,9vw,68px);letter-spacing:-.05em}.card h1 span{color:#d8dde8}.card p{opacity:.82;line-height:1.45}.play{border:0;border-radius:14px;background:#f3f5f8;color:#080b11;font-weight:1000;font-size:18px;padding:14px 24px;min-width:190px}.keys{font-size:13px;opacity:.7;margin-top:12px}.hide{display:none!important}
  @media (min-width:900px) and (pointer:fine){#controls{opacity:.42}.btn{width:60px;height:60px}.btn.big{width:68px;height:68px}}
  @media (max-width:600px){.panel{min-width:0;padding:7px 8px}.label{font-size:10px}#hud{gap:6px;padding:7px}.btn{width:62px;height:62px}.btn.big{width:70px;height:70px}.cluster{gap:7px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="hud">
  <div class="panel" style="flex:1;max-width:420px">
    <div class="label">ВЕНОМ</div>
    <div class="row"><span>♥</span><div class="bar"><div class="fill" id="hpFill"></div></div><span id="hpText">100</span></div>
    <div class="row" style="margin-top:5px"><span>◉</span><div class="bar"><div class="fill" id="symFill"></div></div><span id="symText">100</span></div>
  </div>
  <div class="panel" style="text-align:right;min-width:140px"><div class="label">НОЧЬ</div><div><span id="waveText">Волна 1</span> · <span id="scoreText">0</span></div><div id="enemyText" style="font-size:12px;opacity:.72">Врагов: 0</div></div>
</div>
<div id="centerMsg"></div>
<div id="controls">
  <div class="cluster"><div class="btn" data-hold="left"><span class="icon">◀</span></div><div class="btn" data-hold="right"><span class="icon">▶</span></div><div class="btn" data-action="jump"><span class="icon">↑</span><span class="smalltxt">ПРЫЖОК</span></div></div>
  <div class="cluster"><div class="btn big" data-action="attack"><span class="icon">✹</span><span class="smalltxt">УДАР</span></div><div class="btn big" data-action="tentacle"><span class="icon">〰</span><span class="smalltxt">ЩУПАЛЬЦЕ</span></div></div>
</div>
<div id="start"><div class="card"><h1>VENOM<span>:</span></h1><h2 style="margin:0 0 14px">НОЧНОЙ БОЙ</h2><p>Ты — Веном. Город заполнили охотники на симбиотов. Разнеси их, переживи волны и доберись до финального противника.</p><button class="play" id="playBtn">НАЧАТЬ ДРАКУ</button><div class="keys">Компьютер: A/D или ←/→ · W/Space — прыжок · J — удар · K — щупальце</div></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const hpFill=document.getElementById('hpFill'),symFill=document.getElementById('symFill'),hpText=document.getElementById('hpText'),symText=document.getElementById('symText'),waveText=document.getElementById('waveText'),scoreText=document.getElementById('scoreText'),enemyText=document.getElementById('enemyText'),centerMsg=document.getElementById('centerMsg'),start=document.getElementById('start');
let W=960,H=540,DPR=1,ground=440,scale=1,last=0,time=0,running=false,gameOver=false,wave=1,score=0,shake=0,spawnTimer=0,wavePause=0,bossSpawned=false;
const keys={left:false,right:false}; const particles=[],enemies=[],projectiles=[],buildings=[],stars=[];
let audioCtx=null;
function tone(freq=120,d=.08,type='sawtooth',vol=.04){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);ground=H-Math.max(95,Math.min(130,H*.2));scale=Math.max(.72,Math.min(1.2,H/650));makeCity()}
function makeCity(){buildings.length=0;stars.length=0;for(let i=0;i<55;i++)stars.push({x:Math.random()*W,y:Math.random()*ground*.55,r:Math.random()*1.5+.3});let x=-20;while(x<W+80){const w=55+Math.random()*100,h=80+Math.random()*220;buildings.push({x,w,h,seed:Math.random()});x+=w-3}}
addEventListener('resize',resize);resize();
const player={x:W*.26,y:ground-92,w:62,h:92,vx:0,vy:0,dir:1,onGround:true,hp:100,sym:100,attackCd:0,tentacleCd:0,inv:0,combo:0,comboT:0,anim:0};
function reset(){wave=1;score=0;shake=0;spawnTimer=.5;wavePause=0;bossSpawned=false;enemies.length=0;projectiles.length=0;particles.length=0;Object.assign(player,{x:W*.25,y:ground-92,vx:0,vy:0,dir:1,onGround:true,hp:100,sym:100,attackCd:0,tentacleCd:0,inv:0,combo:0,comboT:0});gameOver=false;message('ВОЛНА 1');updateHud()}
function message(t,ms=1200){centerMsg.textContent=t;centerMsg.style.opacity=1;clearTimeout(message.t);message.t=setTimeout(()=>centerMsg.style.opacity=0,ms)}
function particle(x,y,c='#fff',n=8,force=180){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*force,vy:(Math.random()-.7)*force,life:.35+Math.random()*.35,c,s:2+Math.random()*5})}
function spawnEnemy(type){let side=Math.random()<.5?-1:1,x=side<0?-80:W+80;
  if(type==='boss'){enemies.push({type:'boss',x:W*.72,y:ground-108,w:66,h:108,vx:0,vy:0,dir:-1,hp:260,maxHp:260,hit:0,attack:1.2,shoot:1.5,onGround:true,state:'idle',name:'ЧЕЛОВЕК-ПАУК'});message('БОСС: ЧЕЛОВЕК-ПАУК!',1800);return}
  const brute=type==='brute';enemies.push({type:brute?'brute':'hunter',x,y:ground-(brute?86:74),w:brute?58:48,h:brute?86:74,vx:0,vy:0,dir:side<0?1:-1,hp:brute?75:42,maxHp:brute?75:42,hit:0,attack:.4+Math.random()*.8,onGround:true,state:'walk',name:brute?'ТЯЖЁЛЫЙ ОХОТНИК':'ОХОТНИК'})
}
function expectedForWave(w){if(w>=5)return 0;return 3+w*2}
let spawnedThisWave=0;
function startWave(n){wave=n;spawnedThisWave=0;spawnTimer=.4;bossSpawned=false;message(n===5?'ФИНАЛЬНЫЙ БОЙ':'ВОЛНА '+n)}
function hurtPlayer(d,fromX){if(player.inv>0||gameOver)return;player.hp=Math.max(0,player.hp-d);player.inv=.55;player.vx=(player.x<fromX?-1:1)*260;player.vy=-180;shake=8;particle(player.x+player.w/2,player.y+35,'#f5f5f5',14,220);tone(68,.14,'square',.05);if(player.hp<=0){gameOver=true;message('ВЕНОМ ПОВЕРЖЕН',2500);setTimeout(()=>{start.classList.remove('hide');document.querySelector('.card h2').textContent='ПОПРОБУЙ ЕЩЁ РАЗ';document.getElementById('playBtn').textContent='СНОВА В БОЙ'},900)}updateHud()}
function hitEnemy(e,d,kx=180,ky=-80){if(e.hit>0)return false;e.hp-=d;e.hit=.16;e.vx=kx*player.dir;e.vy=ky;player.sym=Math.min(100,player.sym+7);score+=Math.round(d*2);shake=5;particle(e.x+e.w/2,e.y+e.h*.4,e.type==='boss'?'#e5ecff':'#ffcf66',10,190);tone(100+Math.random()*40,.07,'sawtooth',.035);if(e.hp<=0){score+=e.type==='boss'?1500:200;particle(e.x+e.w/2,e.y+e.h/2,'#fff',25,300);e.dead=true;if(e.type==='boss'){message('ПОБЕДА! ВЕНОМ ВЛАДЕЕТ НОЧЬЮ',3500);running=false;setTimeout(()=>{start.classList.remove('hide');document.querySelector('.card h2').textContent='ГОРОД ТВОЙ';document.getElementById('playBtn').textContent='СЫГРАТЬ ЕЩЁ'},1400)}}updateHud();return true}
function attack(){if(!running||gameOver||player.attackCd>0)return;player.attackCd=.28;player.combo=player.comboT>0?(player.combo%3)+1:1;player.comboT=.7;const reach=player.combo===3?92:72,damage=player.combo===3?28:18;const ax=player.dir>0?player.x+player.w:player.x-reach;for(const e of enemies){if(e.dead)continue;if(rects(ax,player.y+12,reach,player.h-18,e.x,e.y,e.w,e.h))hitEnemy(e,damage,210+player.combo*35,-90-player.combo*15)}particle(player.x+player.w/2+player.dir*42,player.y+44,'#d8dbe2',5,120);tone(84+player.combo*22,.055,'square',.025)}
function tentacle(){if(!running||gameOver||player.tentacleCd>0||player.sym<25)return;player.sym-=25;player.tentacleCd=.68;const reach=Math.min(330,W*.42),ax=player.dir>0?player.x+player.w:player.x-reach;let hit=false;for(const e of enemies){if(e.dead)continue;if(rects(ax,player.y-10,reach,player.h+30,e.x,e.y,e.w,e.h)){hitEnemy(e,36,380,-140);hit=true}}particle(player.x+player.w/2+player.dir*reach*.7,player.y+45,'#8f7dff',14,220);tone(hit?58:72,.19,'sawtooth',.04);updateHud()}
function jump(){if(!running||gameOver)return;if(player.onGround){player.vy=-560*scale;player.onGround=false;tone(115,.08,'triangle',.025)}}
function rects(x,y,w,h,x2,y2,w2,h2){return x<x2+w2&&x+w>x2&&y<y2+h2&&y+h>y2}
function update(dt){time+=dt;if(!running)return;player.attackCd=Math.max(0,player.attackCd-dt);player.tentacleCd=Math.max(0,player.tentacleCd-dt);player.inv=Math.max(0,player.inv-dt);player.comboT=Math.max(0,player.comboT-dt);player.sym=Math.min(100,player.sym+4*dt);player.anim+=dt*(6+Math.abs(player.vx)*.015);
  const accel=1800*scale,max=330*scale;if(keys.left){player.vx-=accel*dt;player.dir=-1}if(keys.right){player.vx+=accel*dt;player.dir=1}if(!keys.left&&!keys.right)player.vx*=Math.pow(.001,dt);player.vx=Math.max(-max,Math.min(max,player.vx));player.vy+=1400*scale*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;if(player.y+player.h>=ground){player.y=ground-player.h;player.vy=0;player.onGround=true}player.x=Math.max(10,Math.min(W-player.w-10,player.x));
  if(wave<5){const need=expectedForWave(wave);spawnTimer-=dt;if(spawnedThisWave<need&&spawnTimer<=0){spawnEnemy(wave>=3&&spawnedThisWave%3===2?'brute':'hunter');spawnedThisWave++;spawnTimer=Math.max(.55,1.25-wave*.09)}if(spawnedThisWave>=need&&enemies.every(e=>e.dead)){wavePause+=dt;if(wavePause>1.4){wavePause=0;startWave(wave+1)}}}else if(!bossSpawned){spawnEnemy('boss');bossSpawned=true}
  for(const e of enemies){if(e.dead)continue;e.hit=Math.max(0,e.hit-dt);e.attack-=dt;const dx=(player.x+player.w/2)-(e.x+e.w/2);e.dir=dx>=0?1:-1;if(e.type==='boss')updateBoss(e,dt,dx);else{const dist=Math.abs(dx);if(dist>58){e.vx+=e.dir*(e.type==='brute'?650:900)*dt;e.vx=Math.max(-(e.type==='brute'?125:175),Math.min(e.type==='brute'?125:175,e.vx))}else{e.vx*=.75;if(e.attack<=0){hurtPlayer(e.type==='brute'?18:10,e.x);e.attack=e.type==='brute'?1.25:.85}}
      e.vy+=1400*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.y+e.h>=ground){e.y=ground-e.h;e.vy=0;e.onGround=true}}
  }
  for(const p of projectiles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.kind==='web'&&!p.dead&&rects(p.x-8,p.y-8,16,16,player.x,player.y,player.w,player.h)){p.dead=true;hurtPlayer(12,p.x);player.vx*=.25}if(p.x<-40||p.x>W+40||p.y>H+40)p.dead=true}
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=450*dt;p.life-=dt;p.s*=.992}
  for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);for(let i=projectiles.length-1;i>=0;i--)if(projectiles[i].dead||projectiles[i].life<=0)projectiles.splice(i,1);for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead&&wave<5)enemies.splice(i,1);
  shake*=Math.pow(.02,dt);updateHud()
}
function updateBoss(e,dt,dx){const dist=Math.abs(dx);e.shoot-=dt;if(e.state==='leap'){e.vy+=1250*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.y+e.h>=ground){e.y=ground-e.h;e.vy=0;e.onGround=true;e.state='idle';if(Math.abs((e.x+e.w/2)-(player.x+player.w/2))<105)hurtPlayer(20,e.x)}}else{if(dist>95){e.vx=e.dir*210;e.x+=e.vx*dt}else e.vx=0;if(e.attack<=0&&dist<110){hurtPlayer(16,e.x);e.attack=.75}if(e.shoot<=0&&dist>150){const a=Math.atan2((player.y+30)-(e.y+30),(player.x+30)-(e.x+30));projectiles.push({kind:'web',x:e.x+e.w/2,y:e.y+30,vx:Math.cos(a)*370,vy:Math.sin(a)*370,life:2.4});e.shoot=1.35;tone(250,.05,'triangle',.02)}if(Math.random()<dt*.34&&dist>130){e.state='leap';e.vy=-520;e.vx=e.dir*310;e.onGround=false}}e.x=Math.max(8,Math.min(W-e.w-8,e.x))}
function updateHud(){hpFill.style.width=player.hp+'%';symFill.style.width=player.sym+'%';hpText.textContent=Math.ceil(player.hp);symText.textContent=Math.ceil(player.sym);waveText.textContent=wave<5?'Волна '+wave:'БОСС';scoreText.textContent=score;enemyText.textContent='Врагов: '+enemies.filter(e=>!e.dead).length}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake>1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawBg();drawProjectiles();for(const e of enemies)if(!e.dead)drawEnemy(e);drawPlayer();drawParticles();ctx.restore()}
function drawBg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07101d');g.addColorStop(.6,'#151a24');g.addColorStop(1,'#07090d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#dce7ff';for(const s of stars){ctx.globalAlpha=.25+.3*Math.sin(time+s.x);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;const moonX=W*.78,moonY=Math.min(100,H*.16);ctx.fillStyle='#edf2ff';ctx.globalAlpha=.75;ctx.beginPath();ctx.arc(moonX,moonY,30,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  for(let bi=0;bi<buildings.length;bi++){const b=buildings[bi];ctx.fillStyle=bi%2?'#0d121b':'#101621';ctx.fillRect(b.x,ground-b.h,b.w,b.h);for(let yy=ground-b.h+18;yy<ground-15;yy+=24)for(let xx=b.x+12;xx<b.x+b.w-8;xx+=22){if(((xx+yy+bi*17)|0)%7<2){ctx.fillStyle='#c9b36a66';ctx.fillRect(xx,yy,6,8)}}}
  ctx.fillStyle='#15181e';ctx.fillRect(0,ground,W,H-ground);ctx.strokeStyle='#303540';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(W,ground);ctx.stroke();ctx.fillStyle='#262a33';for(let x=0;x<W;x+=115)ctx.fillRect(x,ground+36,58,4)
}
function drawPlayer(){const p=player;ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);ctx.scale(p.dir,1);if(p.inv>0&&Math.floor(p.inv*20)%2===0)ctx.globalAlpha=.45;const bob=p.onGround?Math.sin(p.anim)*2:0;ctx.translate(0,bob);ctx.fillStyle='#050609';ctx.strokeStyle='#29303b';ctx.lineWidth=2;
  // legs
  round(-25,20,22,38,10);round(3,20,22,38,10);ctx.fill();
  // torso
  ctx.beginPath();ctx.ellipse(0,-6,32,43,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  // shoulders / arms
  ctx.beginPath();ctx.ellipse(-31,-5,12,34,-.25,0,Math.PI*2);ctx.ellipse(31,-5,12,34,.25,0,Math.PI*2);ctx.fill();
  // head
  ctx.beginPath();ctx.ellipse(0,-48,25,29,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  // eyes
  ctx.fillStyle='#f5f6fa';ctx.beginPath();ctx.moveTo(-20,-57);ctx.quadraticCurveTo(-7,-66,-4,-44);ctx.quadraticCurveTo(-13,-49,-20,-57);ctx.fill();ctx.beginPath();ctx.moveTo(20,-57);ctx.quadraticCurveTo(7,-66,4,-44);ctx.quadraticCurveTo(13,-49,20,-57);ctx.fill();
  // grin
  ctx.fillStyle='#e7e9ef';ctx.beginPath();ctx.moveTo(-17,-35);ctx.quadraticCurveTo(0,-20,18,-36);ctx.quadraticCurveTo(0,-28,-17,-35);ctx.fill();ctx.strokeStyle='#555';ctx.lineWidth=1;for(let i=-12;i<=12;i+=6){ctx.beginPath();ctx.moveTo(i,-34);ctx.lineTo(i,-28);ctx.stroke()}
  // white spider-ish chest mark
  ctx.strokeStyle='#e9ebf0';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(0,10);ctx.moveTo(-2,-9);ctx.lineTo(-20,-20);ctx.moveTo(2,-9);ctx.lineTo(20,-20);ctx.moveTo(-1,1);ctx.lineTo(-22,14);ctx.moveTo(1,1);ctx.lineTo(22,14);ctx.stroke();
  if(p.attackCd>.12){ctx.strokeStyle='#dfe2ea';ctx.globalAlpha=.7;ctx.lineWidth=5;ctx.beginPath();ctx.arc(42,-5,34,-1.1,1.1);ctx.stroke()}
  if(p.tentacleCd>.35){ctx.strokeStyle='#0a0b0e';ctx.lineWidth=13;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(18,-8);ctx.bezierCurveTo(80,-35,135,35,225,-18);ctx.stroke();ctx.strokeStyle='#4c425f';ctx.lineWidth=2;ctx.stroke()}
  ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h/2);ctx.scale(e.dir,1);if(e.hit>0)ctx.globalAlpha=.55;if(e.type==='boss'){drawSpiderBoss(e)}else{ctx.fillStyle=e.type==='brute'?'#222b35':'#29333e';ctx.strokeStyle='#6c7885';ctx.lineWidth=2;round(-e.w/2,-e.h/2,e.w,e.h,12);ctx.fill();ctx.stroke();ctx.fillStyle='#101318';ctx.beginPath();ctx.arc(0,-e.h*.31,e.w*.32,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff5b58';ctx.fillRect(-e.w*.22,-e.h*.34,e.w*.44,4);ctx.strokeStyle='#b7c1cd';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-e.w*.45,-5);ctx.lineTo(-e.w*.62,28);ctx.moveTo(e.w*.45,-5);ctx.lineTo(e.w*.62,28);ctx.stroke()}
  ctx.restore();drawEnemyBar(e)}
function drawSpiderBoss(e){ctx.fillStyle='#142b6b';round(-24,-8,48,57,12);ctx.fill();ctx.fillStyle='#9c1f2e';round(-21,-52,42,43,18);ctx.fill();ctx.fillStyle='#f5f7ff';ctx.beginPath();ctx.moveTo(-15,-40);ctx.lineTo(-3,-35);ctx.lineTo(-14,-25);ctx.fill();ctx.beginPath();ctx.moveTo(15,-40);ctx.lineTo(3,-35);ctx.lineTo(14,-25);ctx.fill();ctx.strokeStyle='#a92c37';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(-16,10);ctx.lineTo(-20,49);ctx.moveTo(16,10);ctx.lineTo(20,49);ctx.stroke();ctx.strokeStyle='#f3f3f6';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(0,20);ctx.moveTo(-14,5);ctx.lineTo(14,5);ctx.stroke()}
function drawEnemyBar(e){const w=e.type==='boss'?180:54,x=e.x+e.w/2-w/2,y=e.y-14;ctx.fillStyle='#0009';ctx.fillRect(x,y,w,6);ctx.fillStyle=e.type==='boss'?'#e54c5d':'#f0bd4f';ctx.fillRect(x,y,w*Math.max(0,e.hp/e.maxHp),6);if(e.type==='boss'){ctx.fillStyle='#fff';ctx.font='700 11px system-ui';ctx.textAlign='center';ctx.fillText(e.name,e.x+e.w/2,y-5)}}
function drawProjectiles(){for(const p of projectiles){if(p.kind==='web'){ctx.strokeStyle='#eef2ff';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(a)*11,p.y+Math.sin(a)*11)}ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.stroke()}}}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.7);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function setHold(name,v,el){keys[name]=v;el&&el.classList.toggle('on',v)}
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(['ArrowUp','w','W',' '].includes(e.key)){e.preventDefault();jump()}if(['j','J'].includes(e.key))attack();if(['k','K'].includes(e.key))tentacle()});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});
for(const b of document.querySelectorAll('.btn')){const hold=b.dataset.hold,act=b.dataset.action;const down=e=>{e.preventDefault();if(hold)setHold(hold,true,b);if(act==='jump')jump();if(act==='attack')attack();if(act==='tentacle')tentacle()};const up=e=>{e.preventDefault();if(hold)setHold(hold,false,b)};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)}
document.getElementById('playBtn').addEventListener('click',()=>{start.classList.add('hide');if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();reset();running=true;last=performance.now()});
})();
</script>
</body>
</html>
