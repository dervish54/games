<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Кошка-модница</title>
<style>
:root{--pink:#ff6fae;--deep:#8d4b7d;--cream:#fff7fb;--ink:#402d3b;--card:#ffffff;--gold:#ffd76a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(#ffe4f0,#fff6cf);color:var(--ink);touch-action:manipulation}body{min-height:100vh}.wrap{max-width:920px;margin:0 auto;padding:16px 14px 30px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{margin:0;font-size:clamp(28px,7vw,44px)}.score{background:#fff;border:3px solid #ffd2e4;border-radius:999px;padding:10px 16px;font-weight:900;font-size:18px;white-space:nowrap}.stage{position:relative;margin-top:14px;background:linear-gradient(180deg,#fff 0%,#ffeafb 62%,#f8d6aa 62%,#f0c78c 100%);border:4px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(118,57,91,.14);min-height:410px;overflow:hidden}.stage:before,.stage:after{content:"";position:absolute;top:26px;width:52px;height:190px;background:linear-gradient(90deg,#ffd2e4,#f78eb8);border-radius:20px 20px 60px 60px}.stage:before{left:18px;transform:rotate(4deg)}.stage:after{right:18px;transform:scaleX(-1) rotate(4deg)}.cat-area{height:410px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:28px;position:relative}.cat{position:relative;width:240px;height:330px;filter:drop-shadow(0 10px 8px rgba(80,40,60,.14))}.tail{position:absolute;width:104px;height:150px;border:24px solid #c98c57;border-left-color:transparent;border-top-color:transparent;border-radius:50%;right:-40px;bottom:46px;transform:rotate(-17deg)}.body{position:absolute;width:145px;height:185px;border-radius:47% 47% 40% 40%;background:#d99c61;left:49px;bottom:35px}.chest{position:absolute;width:78px;height:100px;border-radius:50%;background:#f7d4a5;left:33px;top:38px}.head{position:absolute;width:168px;height:142px;border-radius:48% 48% 45% 45%;background:#d99c61;left:36px;top:28px}.ear{position:absolute;width:62px;height:75px;background:#d99c61;top:-23px;clip-path:polygon(50% 0,100% 100%,0 100%)}.ear:after{content:"";position:absolute;inset:18px 15px 9px;background:#f3a8ab;clip-path:polygon(50% 0,100% 100%,0 100%)}.ear.l{left:4px;transform:rotate(-9deg)}.ear.r{right:4px;transform:rotate(9deg)}.eye{position:absolute;width:19px;height:25px;background:#342931;border-radius:50%;top:62px}.eye:after{content:"";position:absolute;width:6px;height:7px;border-radius:50%;background:#fff;left:4px;top:4px}.eye.l{left:42px}.eye.r{right:42px}.nose{position:absolute;width:18px;height:13px;background:#ee7c91;border-radius:50% 50% 60% 60%;left:75px;top:91px}.mouth{position:absolute;width:28px;height:15px;border-bottom:3px solid #6d4552;border-radius:50%;left:70px;top:103px}.whisker{position:absolute;width:54px;height:2px;background:#6f594f;top:101px}.w1{left:-31px;transform:rotate(8deg)}.w2{left:-33px;top:113px;transform:rotate(-5deg)}.w3{right:-31px;transform:rotate(-8deg)}.w4{right:-33px;top:113px;transform:rotate(5deg)}.leg{position:absolute;width:44px;height:98px;background:#d99c61;border-radius:22px;bottom:-42px}.leg.l{left:15px}.leg.r{right:15px}.paw{position:absolute;width:56px;height:30px;border-radius:50%;background:#f5c997;bottom:-6px;left:-6px}.bow{position:absolute;z-index:6;left:81px;top:10px;width:78px;height:45px}.bow:before,.bow:after{content:"";position:absolute;top:5px;width:35px;height:34px;border-radius:50% 18% 50% 18%}.bow:before{left:0;transform:rotate(18deg)}.bow:after{right:0;transform:scaleX(-1) rotate(18deg)}.bow span{position:absolute;left:31px;top:13px;width:18px;height:18px;border-radius:50%;z-index:2}.collar{position:absolute;z-index:7;left:62px;top:157px;width:116px;height:18px;border-radius:10px}.collar:after{content:"★";position:absolute;width:30px;height:30px;border-radius:50%;background:#ffd968;color:#8a5d14;text-align:center;line-height:30px;left:43px;top:9px;font-size:16px}.shoe{position:absolute;z-index:5;width:62px;height:36px;border-radius:25px 25px 14px 14px;bottom:-55px}.shoe.l{left:54px}.shoe.r{right:54px}.controls{margin-top:16px;display:grid;gap:12px}.group{background:rgba(255,255,255,.86);border-radius:20px;padding:12px}.group-title{font-weight:900;margin:0 0 9px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{border:3px solid transparent;background:#fff;border-radius:16px;min-height:62px;padding:7px 4px;font-size:32px;box-shadow:0 3px 8px rgba(0,0,0,.07)}.choice small{display:block;font-size:12px;font-weight:800;margin-top:2px;color:#604654}.choice.selected{border-color:var(--pink);background:#fff0f7;transform:translateY(-1px)}.confirm,.again{width:100%;border:0;border-radius:18px;padding:15px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff67a8,#b85cb6);box-shadow:0 6px 0 #853d7a}.confirm:active,.again:active{transform:translateY(4px);box-shadow:0 2px 0 #853d7a}.hint{text-align:center;font-weight:800;font-size:14px;color:#795467;margin:10px 0 0}.game-ui{position:absolute;inset:0;display:none;z-index:20;pointer-events:none}.game-ui.active{display:block}.timer,.likes{position:absolute;top:14px;background:rgba(255,255,255,.94);border-radius:999px;padding:9px 14px;font-weight:900;font-size:18px}.timer{left:14px}.likes{right:14px}.heart{position:absolute;border:0;background:transparent;font-size:46px;line-height:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;filter:drop-shadow(0 3px 3px rgba(80,0,40,.18));animation:pop .25s ease-out}.heart:active{transform:translate(-50%,-50%) scale(.8)}@keyframes pop{from{transform:translate(-50%,-50%) scale(.15)}to{transform:translate(-50%,-50%) scale(1)}}.float{position:absolute;pointer-events:none;font-weight:900;color:#ff438e;font-size:22px;animation:float 700ms ease-out forwards}@keyframes float{to{transform:translateY(-45px) scale(1.3);opacity:0}}.result{position:absolute;inset:0;z-index:30;background:rgba(74,39,66,.55);display:none;align-items:center;justify-content:center;padding:24px}.result.show{display:flex}.result-card{background:#fff;border-radius:24px;padding:24px;text-align:center;max-width:360px;width:100%;box-shadow:0 15px 40px rgba(0,0,0,.2)}.result-card .big{font-size:54px}.result-card h2{font-size:28px;margin:4px 0 8px}.result-card p{font-size:18px;font-weight:700}.again{margin-top:8px}.spark{position:absolute;font-size:22px;opacity:.8}.s1{left:15%;top:18%}.s2{right:16%;top:27%}.s3{left:12%;bottom:18%}.s4{right:13%;bottom:20%}@media(max-width:560px){.wrap{padding:10px 10px 24px}.stage{min-height:355px}.cat-area{height:355px;transform:scale(.87);transform-origin:center bottom}.controls{margin-top:10px}.choice{font-size:27px;min-height:57px}.group{padding:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>🐱 Кошка-модница</h1><div class="score">⭐ <span id="totalScore">0</span></div></div>
  <div class="stage" id="stage">
    <span class="spark s1">✨</span><span class="spark s2">💖</span><span class="spark s3">🌸</span><span class="spark s4">✨</span>
    <div class="cat-area">
      <div class="cat" aria-label="Наряженная кошка">
        <div class="tail"></div><div class="body"><div class="chest"></div><div class="leg l"><div class="paw"></div></div><div class="leg r"><div class="paw"></div></div></div>
        <div class="head"><div class="ear l"></div><div class="ear r"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="mouth"></div><div class="whisker w1"></div><div class="whisker w2"></div><div class="whisker w3"></div><div class="whisker w4"></div></div>
        <div class="bow" id="bow"><span></span></div><div class="collar" id="collar"></div><div class="shoe l" id="shoeL"></div><div class="shoe r" id="shoeR"></div>
      </div>
    </div>
    <div class="game-ui" id="gameUI"><div class="timer">⏱ <span id="time">15</span></div><div class="likes">💗 <span id="likes">0</span></div></div>
    <div class="result" id="result"><div class="result-card"><div class="big">🎉</div><h2>Показ окончен!</h2><p>Ты собрал(а) <strong id="resultLikes">0</strong> лайков</p><p>Очки: <strong id="resultScore">0</strong></p><button class="again" id="again" type="button">Нарядить ещё раз</button></div></div>
  </div>
  <div class="controls" id="dressControls">
    <div class="group"><div class="group-title">🎀 Выбери бантик</div><div class="choices" data-kind="bow"><button class="choice selected" data-value="pink" type="button">🎀<small>Розовый</small></button><button class="choice" data-value="blue" type="button">🦋<small>Голубой</small></button><button class="choice" data-value="gold" type="button">🌟<small>Золотой</small></button></div></div>
    <div class="group"><div class="group-title">💎 Выбери ошейник</div><div class="choices" data-kind="collar"><button class="choice selected" data-value="violet" type="button">💜<small>Сиреневый</small></button><button class="choice" data-value="mint" type="button">💚<small>Мятный</small></button><button class="choice" data-value="red" type="button">❤️<small>Красный</small></button></div></div>
    <div class="group"><div class="group-title">👢 Выбери ботиночки</div><div class="choices" data-kind="shoes"><button class="choice selected" data-value="pink" type="button">👢<small>Розовые</small></button><button class="choice" data-value="blue" type="button">👟<small>Голубые</small></button><button class="choice" data-value="black" type="button">🥾<small>Чёрные</small></button></div></div>
    <button class="confirm" id="confirm" type="button">💖 Подтвердить костюм</button>
    <div class="hint">После подтверждения быстро тапай по сердечкам!</div>
  </div>
</div>
<script>
(function(){
const stage=document.getElementById('stage'), controls=document.getElementById('dressControls'), gameUI=document.getElementById('gameUI'), result=document.getElementById('result');
const bow=document.getElementById('bow'), collar=document.getElementById('collar'), shoeL=document.getElementById('shoeL'), shoeR=document.getElementById('shoeR');
const timeEl=document.getElementById('time'),likesEl=document.getElementById('likes'),totalEl=document.getElementById('totalScore');
let outfit={bow:'pink',collar:'violet',shoes:'pink'},likes=0,time=15,total=0,running=false,heartTimer=null,clock=null;
const bowColors={pink:['#ff67a9','#ff9cc8'],blue:['#55b7ff','#8ed6ff'],gold:['#f1b735','#ffe783']};
const collarColors={violet:'#9b62d1',mint:'#52c7a3',red:'#e95b66'};
const shoeColors={pink:'#f277ae',blue:'#5b9fe8',black:'#4c4850'};
function paint(){const bc=bowColors[outfit.bow];bow.style.setProperty('--c',bc[0]);bow.querySelector('span').style.background=bc[1];bow.style.color=bc[0];bow.style.setProperty('filter','none');bow.querySelector('span').style.boxShadow='0 1px 2px rgba(0,0,0,.1)';bow.style.background='transparent';bow.style.setProperty('--x','0');bow.style.cssText += '';bow.querySelector('span').style.background=bc[1];
  bow.style.setProperty('--bowColor',bc[0]); const st=document.getElementById('dynamicBowStyle')||document.head.appendChild(Object.assign(document.createElement('style'),{id:'dynamicBowStyle'}));st.textContent=`#bow:before,#bow:after{background:${bc[0]}}`;
  collar.style.background=collarColors[outfit.collar];shoeL.style.background=shoeColors[outfit.shoes];shoeR.style.background=shoeColors[outfit.shoes];
}
paint();
document.querySelectorAll('.choices').forEach(group=>group.addEventListener('click',e=>{const b=e.target.closest('.choice');if(!b||running)return;group.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');outfit[group.dataset.kind]=b.dataset.value;paint()}));
function spawnHeart(){if(!running)return;const h=document.createElement('button');h.type='button';h.className='heart';h.textContent=Math.random()<.12?'💖':Math.random()<.25?'💕':'❤️';const rect=stage.getBoundingClientRect();const pad=48;h.style.left=(pad+Math.random()*Math.max(10,rect.width-pad*2))+'px';h.style.top=(70+Math.random()*Math.max(80,rect.height-145))+'px';let gone=false;h.addEventListener('pointerdown',e=>{e.preventDefault();if(gone||!running)return;gone=true;likes++;likesEl.textContent=likes;total+=10;totalEl.textContent=total;const f=document.createElement('div');f.className='float';f.textContent='+10';f.style.left=h.style.left;f.style.top=h.style.top;stage.appendChild(f);setTimeout(()=>f.remove(),720);h.remove()});gameUI.appendChild(h);setTimeout(()=>{gone=true;h.remove()},700+Math.random()*500);}
function finish(){running=false;clearInterval(clock);clearInterval(heartTimer);gameUI.querySelectorAll('.heart').forEach(h=>h.remove());gameUI.classList.remove('active');document.getElementById('resultLikes').textContent=likes;document.getElementById('resultScore').textContent=likes*10;result.classList.add('show')}
function start(){if(running)return;running=true;likes=0;let left=15;likesEl.textContent='0';timeEl.textContent=left;controls.style.display='none';gameUI.classList.add('active');result.classList.remove('show');for(let i=0;i<4;i++)setTimeout(spawnHeart,i*130);heartTimer=setInterval(()=>{spawnHeart();if(Math.random()<.35)spawnHeart()},360);clock=setInterval(()=>{left--;timeEl.textContent=left;if(left<=0)finish()},1000)}
document.getElementById('confirm').addEventListener('click',start);
document.getElementById('again').addEventListener('click',()=>{result.classList.remove('show');controls.style.display='grid'});
})();
</script>
</body>
</html>
