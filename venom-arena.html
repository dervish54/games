<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Venom Arena</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b1017;color:#fff;font-family:Arial,sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;left:10px;right:10px;top:10px;display:flex;gap:8px;justify-content:space-between;z-index:5;font-weight:800;pointer-events:none}#hud span{background:rgba(0,0,0,.38);padding:8px 10px;border-radius:12px}.controls{position:fixed;left:10px;right:10px;bottom:12px;z-index:8;display:grid;grid-template-columns:1fr 1fr 1.1fr 1.1fr 1.1fr;gap:7px}.controls button{min-height:58px;border:0;border-radius:16px;font-size:18px;font-weight:900;background:rgba(255,255,255,.93);color:#111}.controls button:active{transform:scale(.97)}#shoot{background:#d9ff45}#wave{background:#79d8ff}.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72)}.card{background:#171717;border:2px solid #555;border-radius:18px;padding:24px;text-align:center;min-width:260px}.card button{border:0;border-radius:13px;padding:12px 18px;font-size:18px;font-weight:800;background:#d9ff45}.hint{position:fixed;bottom:82px;left:10px;right:10px;text-align:center;font-size:13px;opacity:.8;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud"><span>❤️ <b id="hp">6</b></span><span>⭐ <b id="score">0</b></span><span>🌊 <b id="energy">0</b>%</span></div><div class="hint">Ходи, прыгай, уклоняйся и бей врагов</div><div class="controls"><button id="left">⬅️</button><button id="right">➡️</button><button id="jump">⬆️ Прыжок</button><button id="duck">⬇️ Уклон</button><button id="shoot">🕷️ Бить</button><button id="wave" style="grid-column:3/6">🌊 ВОЛНА</button></div><div class="overlay" id="over"><div class="card"><h2>Веном проиграл!</h2><p>Очки: <b id="final">0</b></p><button id="restart">Ещё раз</button></div></div><script>(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),hpEl=document.getElementById('hp'),scoreEl=document.getElementById('score'),energyEl=document.getElementById('energy'),over=document.getElementById('over'),finalEl=document.getElementById('final');let W,H,D,last,dead=false,score=0,energy=0,spawnT=0,shotT=0,waveT=0,invuln=0;const keys={left:false,right:false,duck:false};const p={x:130,y:0,w:56,h:82,vy:0,onGround:false,hp:6,face:1};let enemies=[],fx=[];function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function ground(){return H-130}function hud(){hpEl.textContent=p.hp;scoreEl.textContent=score;energyEl.textContent=Math.floor(energy)}function reset(){dead=false;score=0;energy=0;spawnT=.4;shotT=0;waveT=0;invuln=0;p.x=130;p.y=ground()-p.h;p.vy=0;p.onGround=true;p.hp=6;p.face=1;enemies=[];fx=[];over.style.display='none';hud();last=performance.now();requestAnimationFrame(loop)}function addEnemy(){const fromRight=Math.random()<.82;const type=Math.random()<.4?'gunner':'brawler';enemies.push({x:fromRight?W+50:-50,y:ground()-62,w:46,h:62,vx:(fromRight?-1:1)*(70+Math.random()*45),hp:type==='gunner'?2:3,type,atk:Math.random()*.8,shoot:1+Math.random()*1.2,dead:false,flash:0})}function jump(){if(!dead&&p.onGround){p.vy=-560;p.onGround=false}}function shoot(){if(dead||shotT>0)return;shotT=.28;let best=null,dist=260;for(const e of enemies){if(e.dead)continue;let dx=(e.x-p.x)*p.face;if(dx>0&&dx<dist&&Math.abs(e.y-p.y)<100){dist=dx;best=e}}if(best){best.hp--;best.flash=.14;energy=Math.min(100,energy+18);fx.push({kind:'tentacle',x1:p.x+p.w/2,y1:p.y+35,x2:best.x+best.w/2,y2:best.y+25,t:.18});if(best.hp<=0){best.dead=true;score+=20}}else fx.push({kind:'tentacle',x1:p.x+p.w/2,y1:p.y+35,x2:p.x+p.face*220,y2:p.y+20,t:.18});hud()}function wave(){if(dead||energy<100||waveT>0)return;energy=0;waveT=.6;for(const e of enemies){if(!e.dead&&Math.abs(e.x-p.x)<330){e.hp-=3;e.flash=.25;if(e.hp<=0){e.dead=true;score+=25}}}fx.push({kind:'wave',x:p.x+p.w/2,y:p.y+p.h/2,t:.55,r:20});hud()}function hurt(){if(invuln>0||dead)return;invuln=.9;p.hp--;hud();if(p.hp<=0){dead=true;finalEl.textContent=score;over.style.display='flex'}}function bindHold(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false))}bindHold('left','left');bindHold('right','right');bindHold('duck','duck');document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.getElementById('shoot').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});document.getElementById('wave').addEventListener('pointerdown',e=>{e.preventDefault();wave()});document.getElementById('restart').onclick=reset;addEventListener('keydown',e=>{if(e.code==='ArrowLeft')keys.left=true;if(e.code==='ArrowRight')keys.right=true;if(e.code==='ArrowDown')keys.duck=true;if(e.code==='ArrowUp'||e.code==='Space')jump();if(e.code==='KeyX'||e.code==='Enter')shoot();if(e.code==='KeyZ')wave()});addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false;if(e.code==='ArrowDown')keys.duck=false});function update(dt){if(dead)return;if(invuln>0)invuln-=dt;if(shotT>0)shotT-=dt;if(waveT>0)waveT-=dt;let vx=0;if(keys.left){vx-=210;p.face=-1}if(keys.right){vx+=210;p.face=1}p.x=Math.max(0,Math.min(W-p.w,p.x+vx*dt));p.vy+=1350*dt;p.y+=p.vy*dt;if(p.y>=ground()-p.h){p.y=ground()-p.h;p.vy=0;p.onGround=true}else p.onGround=false;spawnT-=dt;if(spawnT<=0){addEnemy();spawnT=.8+Math.random()*.7}const ph=keys.duck?48:p.h,py=keys.duck?p.y+(p.h-ph):p.y;for(const e of enemies){if(e.dead)continue;e.flash=Math.max(0,e.flash-dt);let dx=p.x-e.x;if(Math.abs(dx)>70)e.x+=Math.sign(dx)*Math.abs(e.vx)*dt;else e.x+=Math.sin(performance.now()/180+e.x)*8*dt;if(e.type==='brawler'){e.atk-=dt;if(Math.abs(dx)<72&&Math.abs(e.y-py)<80&&e.atk<=0){e.atk=1.1;if(!keys.duck)hurt();fx.push({kind:'hit',x:p.x+p.w/2,y:py+25,t:.25})}}else{e.shoot-=dt;if(e.shoot<=0&&Math.abs(dx)<380){e.shoot=1.2+Math.random()*.8;fx.push({kind:'bullet',x:e.x+23,y:e.y+25,vx:Math.sign(dx)*260,t:2})}}}for(const f of fx){if(f.kind==='bullet'){f.x+=f.vx*dt;f.t-=dt;if(f.t>0&&f.x>p.x&&f.x<p.x+p.w&&f.y>py&&f.y<py+ph){f.t=0;if(!keys.duck||f.y>py+ph*.55)hurt()}}else{f.t-=dt;if(f.kind==='wave')f.r+=520*dt}}enemies=enemies.filter(e=>!e.dead&&e.x>-120&&e.x<W+120);fx=fx.filter(f=>f.t>0);hud()}function draw(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1b30');g.addColorStop(.72,'#192431');g.addColorStop(1,'#111');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#252a31';ctx.fillRect(0,ground(),W,H-ground());ctx.fillStyle='#3a4048';ctx.fillRect(0,ground(),W,12);for(let i=0;i<9;i++){ctx.fillStyle='#152238';ctx.fillRect(i*140-30,ground()-140-(i%3)*40,95,140+(i%3)*40)}for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.flash>0?'#fff':'#7a1b24';ctx.fillRect(0,14,e.w,e.h-14);ctx.fillStyle=e.type==='gunner'?'#ffb347':'#ff5d6c';ctx.beginPath();ctx.arc(e.w/2,14,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(9,9,10,5);ctx.fillRect(27,9,10,5);if(e.type==='gunner'){ctx.fillStyle='#222';ctx.fillRect(e.w-2,28,24,7)}ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText('❤'.repeat(Math.max(0,e.hp)),3,58);ctx.restore()}ctx.save();ctx.translate(p.x,p.y+(keys.duck?30:0));if(invuln>0&&Math.floor(invuln*12)%2===0)ctx.globalAlpha=.35;ctx.fillStyle='#050505';ctx.beginPath();ctx.ellipse(28,44,26,keys.duck?24:36,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(28,18,23,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(7,14);ctx.lineTo(24,18);ctx.lineTo(12,28);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(49,14);ctx.lineTo(32,18);ctx.lineTo(44,28);ctx.closePath();ctx.fill();ctx.restore();for(const f of fx){if(f.kind==='tentacle'){ctx.strokeStyle='#090909';ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.quadraticCurveTo((f.x1+f.x2)/2,f.y1-45,f.x2,f.y2);ctx.stroke();ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.stroke()}else if(f.kind==='bullet'){ctx.fillStyle='#ffd95e';ctx.beginPath();ctx.arc(f.x,f.y,6,0,Math.PI*2);ctx.fill()}else if(f.kind==='wave'){ctx.strokeStyle='rgba(130,220,255,.8)';ctx.lineWidth=10;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.stroke()}else if(f.kind==='hit'){ctx.font='30px Arial';ctx.fillText('💥',f.x,f.y)}}}function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();if(!dead)requestAnimationFrame(loop)}reset()})();</script></body></html>
