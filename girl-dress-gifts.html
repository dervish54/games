<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Наряди девочку</title><style>html,body{margin:0;min-height:100%;background:linear-gradient(#ffeef8,#dff3ff);font-family:Arial,sans-serif;color:#43283c}*{box-sizing:border-box}body{display:flex;justify-content:center}.game{width:min(100%,760px);padding:14px 14px 24px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{background:#fff8;border:2px solid #fff;padding:8px 12px;border-radius:16px;font-weight:800}.stage{position:relative;height:390px;margin:12px 0;border-radius:26px;background:linear-gradient(#bde8ff 0 62%,#8fda8d 62%);overflow:hidden;border:3px solid #fff;box-shadow:0 8px 24px #9b7c9630}.cloud{position:absolute;font-size:54px;opacity:.7}.c1{left:20px;top:18px}.c2{right:24px;top:58px}.girl{position:absolute;left:50%;bottom:42px;width:180px;height:300px;transform:translateX(-50%)}.head{position:absolute;left:50%;top:5px;width:92px;height:98px;transform:translateX(-50%);border-radius:48% 48% 45% 45%;background:#ffd1b6;border:3px solid #9b624f;z-index:5}.hair{position:absolute;left:50%;top:-3px;width:106px;height:110px;transform:translateX(-50%);background:#6b3f25;border-radius:52% 52% 44% 44%;z-index:4}.hair:after{content:'';position:absolute;left:-7px;right:-7px;top:56px;height:92px;background:#6b3f25;border-radius:0 0 45% 45%}.face{position:absolute;z-index:6;left:50%;top:43px;transform:translateX(-50%);font-size:28px}.neck{position:absolute;left:50%;top:92px;width:24px;height:30px;background:#ffd1b6;transform:translateX(-50%);z-index:3}.body{position:absolute;left:50%;top:118px;width:76px;height:100px;background:#ffd1b6;transform:translateX(-50%);border-radius:28px 28px 12px 12px;z-index:2}.arm{position:absolute;top:128px;width:26px;height:100px;background:#ffd1b6;border-radius:16px;z-index:1}.a1{left:33px;transform:rotate(7deg)}.a2{right:33px;transform:rotate(-7deg)}.leg{position:absolute;top:205px;width:31px;height:80px;background:#ffd1b6;border-radius:12px;z-index:1}.l1{left:55px}.l2{right:55px}.topwear,.bottomwear,.dress,.shoe{position:absolute;z-index:4}.topwear{left:50%;top:116px;width:92px;height:92px;transform:translateX(-50%);border-radius:22px 22px 12px 12px}.bottomwear{left:50%;top:200px;width:94px;height:78px;transform:translateX(-50%)}.dress{left:50%;top:116px;width:126px;height:154px;transform:translateX(-50%);clip-path:polygon(24% 0,76% 0,100% 100%,0 100%);border-radius:20px}.shoe{top:272px;width:48px;height:28px;border-radius:60% 40% 28% 28%;border:2px solid #6f4b45}.s1{left:42px}.s2{right:42px}.giftpop{position:absolute;left:50%;top:90px;transform:translateX(-50%) scale(0);font-size:72px;z-index:12;transition:.25s}.giftpop.show{transform:translateX(-50%) scale(1)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.tabs button,.done,.again{border:0;border-radius:15px;padding:11px 6px;font-size:15px;font-weight:800;background:#fff;color:#5d3854;box-shadow:0 3px 9px #7c55742a}.tabs button.active{background:#ff8fc8;color:#fff}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.opt{min-height:76px;border:3px solid transparent;border-radius:18px;background:#fff;font-size:30px;font-weight:800;color:#644;display:flex;flex-direction:column;align-items:center;justify-content:center}.opt span{font-size:12px;margin-top:4px}.opt.sel{border-color:#ff68b2;background:#fff1f8}.done{width:100%;margin-top:12px;background:#ff67ae;color:#fff;font-size:19px;padding:14px}.heart{position:absolute;font-size:42px;z-index:20;filter:drop-shadow(0 3px 2px #a44);animation:float 2.3s linear forwards;touch-action:manipulation}@keyframes float{from{transform:translateY(30px) scale(.8);opacity:.2}20%{opacity:1}to{transform:translateY(-160px) scale(1.25);opacity:0}}.playHud{display:none;gap:8px;margin-top:10px}.playHud .pill{flex:1;text-align:center}.message{text-align:center;font-weight:800;min-height:24px;margin-top:8px}.gifts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}.gift{background:#fff;border-radius:14px;padding:8px 10px;font-size:24px}.hidden{display:none!important}@media(max-width:430px){.stage{height:350px}.girl{transform:translateX(-50%) scale(.9);transform-origin:bottom center}.tabs button{font-size:13px;padding:10px 3px}}</style></head><body><div class="game"><div class="top"><div class="pill">👗 Наряди девочку</div><div class="pill">🎁 Подарков: <span id="giftCount">0</span></div></div><div class="stage" id="stage"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="girl" id="girl"><div class="hair"></div><div class="head"></div><div class="face">😊</div><div class="neck"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div><div class="topwear" id="topwear"></div><div class="bottomwear" id="bottomwear"></div><div class="dress" id="dress"></div><div class="shoe s1" id="shoe1"></div><div class="shoe s2" id="shoe2"></div></div><div class="giftpop" id="giftpop">🎁</div></div><div id="dressUI"><div class="tabs"><button data-tab="dress" class="active">Платья</button><button data-tab="tops">Кофточки</button><button data-tab="pants">Штаны</button><button data-tab="shoes">Ботинки</button></div><div class="options" id="options"></div><button class="done" id="done">💖 ГОТОВО — ЛОВИТЬ СЕРДЕЧКИ</button></div><div class="playHud" id="playHud"><div class="pill">❤️ <span id="hearts">0</span></div><div class="pill">⏱ <span id="time">20</span> сек</div><div class="pill">До подарка: <span id="nextGift">5</span></div></div><div class="message" id="message"></div><div class="gifts" id="gifts"></div><button class="again hidden" id="again">👗 Нарядить заново</button></div><script>(()=>{const stage=document.getElementById('stage'),opts=document.getElementById('options'),dressUI=document.getElementById('dressUI'),playHud=document.getElementById('playHud'),dress=document.getElementById('dress'),topwear=document.getElementById('topwear'),bottomwear=document.getElementById('bottomwear'),shoe1=document.getElementById('shoe1'),shoe2=document.getElementById('shoe2'),message=document.getElementById('message'),giftsEl=document.getElementById('gifts'),giftpop=document.getElementById('giftpop');const items={dress:[['🌸','Розовое','#ff83bd'],['💜','Сиреневое','#9b78f2'],['⭐','Золотое','#f2c84b']],tops:[['🎀','Розовая','#ff92bd'],['💙','Голубая','#6db9f2'],['💚','Мятная','#77d7ae']],pants:[['👖','Джинсы','#5278b8'],['🩷','Розовые','#e578a5'],['🖤','Чёрные','#36353d']],shoes:[['👟','Кеды','#ffffff'],['👢','Сапожки','#8e5c45'],['✨','Туфельки','#e99bc3']]};let tab='dress',sel={dress:0,tops:0,pants:0,shoes:0},hearts=0,time=20,playing=false,timer=null,spawner=null,giftCount=0;const giftList=['👑','🧸','💐','👜','🪄','🎈','💎','🐰'];function apply(){const usingDress=sel.dress!==null;dress.style.display=usingDress?'block':'none';topwear.style.display=usingDress?'none':'block';bottomwear.style.display=usingDress?'none':'block';if(usingDress)dress.style.background=items.dress[sel.dress][2];else{topwear.style.background=items.tops[sel.tops][2];bottomwear.style.background=items.pants[sel.pants][2]}shoe1.style.background=shoe2.style.background=items.shoes[sel.shoes][2]}function render(){opts.innerHTML='';items[tab].forEach((it,i)=>{const b=document.createElement('button');b.className='opt '+(sel[tab]===i?'sel':'');b.innerHTML=`<b>${it[0]}</b><span>${it[1]}</span>`;b.onclick=()=>{if(tab==='dress'){sel.dress=i}else{sel[tab]=i;if(tab==='tops'||tab==='pants')sel.dress=null}apply();render()};opts.appendChild(b)})}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});function spawnHeart(){if(!playing)return;const h=document.createElement('button');h.className='heart';h.textContent=['❤️','💖','💕'][Math.floor(Math.random()*3)];h.style.border='0';h.style.background='transparent';h.style.left=(10+Math.random()*78)+'%';h.style.top=(180+Math.random()*120)+'px';let got=false;h.onpointerdown=e=>{e.preventDefault();if(got||!playing)return;got=true;hearts++;document.getElementById('hearts').textContent=hearts;document.getElementById('nextGift').textContent=5-(hearts%5||5);h.remove();if(hearts%5===0)giveGift()};stage.appendChild(h);setTimeout(()=>h.remove(),2300)}function giveGift(){giftCount++;document.getElementById('giftCount').textContent=giftCount;const gift=giftList[Math.floor(Math.random()*giftList.length)];giftpop.textContent=gift;giftpop.classList.add('show');setTimeout(()=>giftpop.classList.remove('show'),900);const g=document.createElement('div');g.className='gift';g.textContent=gift;giftsEl.appendChild(g);message.textContent='Ты получила подарок! '+gift}function start(){dressUI.classList.add('hidden');playHud.style.display='flex';document.getElementById('again').classList.add('hidden');hearts=0;time=20;playing=true;document.getElementById('hearts').textContent='0';document.getElementById('time').textContent=time;document.getElementById('nextGift').textContent='5';message.textContent='Быстро нажимай на сердечки! Каждые 5 сердечек — подарок 🎁';spawner=setInterval(spawnHeart,520);timer=setInterval(()=>{time--;document.getElementById('time').textContent=time;if(time<=0)finish()},1000)}function finish(){playing=false;clearInterval(spawner);clearInterval(timer);stage.querySelectorAll('.heart').forEach(h=>h.remove());message.textContent=`Готово! Ты собрала ${hearts} сердечек и получила ${Math.floor(hearts/5)} подарков.`;document.getElementById('again').classList.remove('hidden')}document.getElementById('done').onclick=start;document.getElementById('again').onclick=()=>{dressUI.classList.remove('hidden');playHud.style.display='none';document.getElementById('again').classList.add('hidden');message.textContent='';giftsEl.innerHTML=''};apply();render()})();</script></body></html>
