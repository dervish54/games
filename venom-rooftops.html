<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Venom Rooftops</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;left:12px;right:12px;top:10px;z-index:5;display:flex;justify-content:space-between;gap:8px;font-weight:800;text-shadow:0 2px 4px #000;pointer-events:none}#hud div{background:rgba(0,0,0,.28);padding:8px 10px;border-radius:12px}.controls{position:fixed;left:12px;right:12px;bottom:14px;z-index:6;display:flex;justify-content:space-between;gap:14px}.controls button{flex:1;min-height:58px;border:0;border-radius:18px;font-size:20px;font-weight:900;background:rgba(255,255,255,.9);color:#101010;box-shadow:0 4px 12px rgba(0,0,0,.35)}#attack{background:#d9ff45}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:10}.card{background:#151515;border:2px solid #555;border-radius:20px;padding:24px;min-width:260px;text-align:center}.card button{border:0;border-radius:14px;padding:12px 18px;font-size:18px;font-weight:800;background:#d9ff45}</style></head><body><canvas id="game"></canvas><div id="hud"><div>❤️ <span id="hp">5</span></div><div>⭐ <span id="score">0</span></div><div>⚡ <span id="bonus">—</span></div></div><div class="controls"><button id="jump">⬆️ ПРЫЖОК</button><button id="attack">🕷️ ЩУПАЛЬЦЕ</button></div><div class="overlay" id="over"><div class="card"><h2>Веном повержен!</h2><p>Очки: <b id="final">0</b></p><button id="restart">Играть снова</button></div></div><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),hpEl=document.getElementById('hp'),scoreEl=document.getElementById('score'),bonusEl=document.getElementById('bonus'),over=document.getElementById('over'),finalEl=document.getElementById('final');let W=0,H=0,D=1,last=0,worldX=0,score=0,hp=5,dead=false,speed=210,gravity=1300,jumpV=-520,attackT=0,attackTarget=null,shieldT=0,frenzyT=0,invuln=0,spawnX=0;let player={sx:110,y:0,vy:0,w:54,h:78,onGround:false};let roofs=[],enemies=[],bonuses=[],particles=[];function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function roofY(){return H-130}function reset(){worldX=0;score=0;hp=5;dead=false;speed=210;attackT=0;attackTarget=null;shieldT=0;frenzyT=0;invuln=0;spawnX=0;player.y=roofY()-player.h;player.vy=0;player.onGround=true;roofs=[];enemies=[];bonuses=[];particles=[];over.style.display='none';for(let i=0;i<12;i++)makeRoof();hud();last=performance.now();requestAnimationFrame(loop)}function hud(){hpEl.textContent=hp;scoreEl.textContent=Math.floor(score);bonusEl.textContent=shieldT>0?'ЩИТ':frenzyT>0?'ЯРОСТЬ':'—'}function makeRoof(){let w=190+Math.random()*220,gap=spawnX===0?0:50+Math.random()*95,y=roofY()-(Math.random()<.22?35:0);let r={x:spawnX+gap,w,y};roofs.push(r);spawnX=r.x+w;if(r.x>260&&Math.random()<.82){let count=1+(Math.random()<.48?1:0)+(Math.random()<.20?1:0);for(let i=0;i<count;i++){enemies.push({x:r.x+r.w*(.28+.22*i+Math.random()*.12),baseX:r.x+r.w*(.28+.22*i+Math.random()*.12),y:r.y-58,w:42,h:58,hp:Math.random()<.35?2:1,phase:Math.random()*6.28,attackCd:.4+Math.random()*1.1,windup:0,flash:0,dead:false})}}if(r.x>200&&Math.random()<.62){let kind=['heal','shield','frenzy'][Math.floor(Math.random()*3)];bonuses.push({x:r.x+r.w*(.2+.6*Math.random()),y:r.y-90,kind,t:Math.random()*6.28})}}function jump(){if(dead)return;if(player.onGround){player.vy=jumpV;player.onGround=false}}function attack(){if(dead||attackT>0)return;attackT=.24;let px=worldX+player.sx+player.w*.8,py=player.y+player.h*.45,target=null,best=235;for(const e of enemies){if(e.dead)continue;let d=Math.hypot(e.x-px,(e.y+20)-py);if(e.x>px-30&&d<best){best=d;target=e}}attackTarget=target;if(target){target.hp--;target.flash=.18;particles.push({x:target.x,y:target.y+15,t:.35,type:'hit'});if(target.hp<=0){score+=frenzyT>0?40:20;target.dead=true;particles.push({x:target.x,y:target.y,t:.45,type:'boom'})}}}document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='KeyX'||e.code==='Enter')attack()});document.getElementById('restart').onclick=reset;function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function hurt(){if(invuln>0)return;if(shieldT>0){shieldT=0;invuln=.65;hud();particles.push({x:worldX+player.sx+25,y:player.y+20,t:.4,type:'shield'});return}hp--;invuln=.85;hud();particles.push({x:worldX+player.sx+25,y:player.y+20,t:.45,type:'ouch'});if(hp<=0)gameOver()}function gameOver(){dead=true;finalEl.textContent=Math.floor(score);over.style.display='flex'}function update(dt){if(dead)return;worldX+=speed*dt;score+=dt*5;if(shieldT>0)shieldT-=dt;if(frenzyT>0)frenzyT-=dt;if(invuln>0)invuln-=dt;attackT=Math.max(0,attackT-dt);while(spawnX<worldX+W+500)makeRoof();player.vy+=gravity*dt;player.y+=player.vy*dt;player.onGround=false;let pw={x:worldX+player.sx,y:player.y,w:player.w,h:player.h};let feet={x:pw.x+8,y:pw.y+player.h-4,w:player.w-16,h:10};for(const r of roofs){let rr={x:r.x,y:r.y,w:r.w,h:H-r.y};if(player.vy>=0&&rects(feet,rr)&&pw.y+player.h-16<r.y){player.y=r.y-player.h;player.vy=0;player.onGround=true;pw.y=player.y;feet.y=pw.y+player.h-4}}if(player.y>H+120)gameOver();for(const e of enemies){if(e.dead)continue;e.phase+=dt*3;e.flash=Math.max(0,e.flash-dt);let dx=(worldX+player.sx+player.w/2)-e.x;if(Math.abs(dx)<230){let desired=dx>0?62:-62;if(Math.abs(dx)>72)e.x+=Math.sign(dx)*70*dt;e.attackCd-=dt;if(Math.abs(dx)<88&&Math.abs((player.y+30)-(e.y+20))<70){if(e.windup<=0&&e.attackCd<=0){e.windup=.34;e.attackCd=1.15+Math.random()*.55}else if(e.windup>0){e.windup-=dt;if(e.windup<=0){hurt();particles.push({x:e.x,y:e.y+15,t:.35,type:'enemyhit'})}}}}else{e.x+=Math.sin(e.phase)*8*dt}let er={x:e.x-e.w/2,y:e.y,w:e.w,h:e.h};if(rects(pw,er)&&e.windup<=0){e.x+=dx>0?-22:22}}for(const b of bonuses){let br={x:b.x-18,y:b.y-18,w:36,h:36};if(!b.dead&&rects(pw,br)){b.dead=true;score+=15;if(b.kind==='heal')hp=Math.min(5,hp+1);if(b.kind==='shield')shieldT=7;if(b.kind==='frenzy')frenzyT=7;hud()}}enemies=enemies.filter(e=>!e.dead&&e.x>worldX-220);bonuses=bonuses.filter(b=>!b.dead&&b.x>worldX-200);roofs=roofs.filter(r=>r.x+r.w>worldX-300);for(const p of particles)p.t-=dt;particles=particles.filter(p=>p.t>0);hud()}function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07162b');g.addColorStop(.7,'#13202e');g.addColorStop(1,'#050607');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#18314b';for(let i=0;i<12;i++){let bx=((i*180-worldX*.18)%(W+220))-100,bh=120+(i%5)*45;x.fillRect(bx,H-130-bh,110,bh)}for(const r of roofs){let sx=r.x-worldX;x.fillStyle='#2c2f35';x.fillRect(sx,r.y,r.w,H-r.y);x.fillStyle='#4b5159';x.fillRect(sx,r.y,r.w,12);x.fillStyle='#f4d35e';for(let wx=20;wx<r.w-10;wx+=42)x.fillRect(sx+wx,r.y+35,16,22)}for(const b of bonuses){let sx=b.x-worldX,sy=b.y+Math.sin(performance.now()/250+b.t)*6;x.font='34px Arial';x.textAlign='center';x.fillText(b.kind==='heal'?'❤️':b.kind==='shield'?'🛡️':'⚡',sx,sy)}for(const e of enemies){let sx=e.x-worldX;x.save();x.translate(sx,e.y);if(e.flash>0)x.globalAlpha=.45;x.fillStyle=e.windup>0?'#a61f30':'#5b1320';x.fillRect(-21,0,42,58);x.fillStyle=e.windup>0?'#ff324f':'#ff5a6c';x.beginPath();x.arc(0,0,21,0,Math.PI*2);x.fill();x.fillStyle='#111';x.fillRect(-13,-5,9,5);x.fillRect(4,-5,9,5);if(e.windup>0){x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.moveTo(-25,18);x.lineTo(-42,-3);x.stroke()}if(e.hp>1){x.fillStyle='#fff';x.font='12px Arial';x.fillText(String(e.hp),-3,38)}x.restore()}let px=player.sx,py=player.y;x.save();x.translate(px,py);if(invuln>0&&Math.floor(invuln*12)%2===0)x.globalAlpha=.35;if(shieldT>0){x.strokeStyle='rgba(90,190,255,.8)';x.lineWidth=5;x.beginPath();x.arc(player.w/2,player.h/2,48,0,Math.PI*2);x.stroke()}x.fillStyle='#060606';x.beginPath();x.ellipse(27,43,25,35,0,0,Math.PI*2);x.fill();x.fillStyle='#050505';x.beginPath();x.arc(27,20,23,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(8,16);x.lineTo(24,20);x.lineTo(13,29);x.closePath();x.fill();x.beginPath();x.moveTo(46,16);x.lineTo(30,20);x.lineTo(41,29);x.closePath();x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(27,29,12,.2,2.9);x.stroke();x.restore();if(attackT>0){let startX=px+45,startY=py+38,targetX=startX+170,targetY=startY-20;if(attackTarget&&!attackTarget.dead){targetX=attackTarget.x-worldX;targetY=attackTarget.y+20}x.strokeStyle='#111';x.lineWidth=14;x.lineCap='round';x.beginPath();x.moveTo(startX,startY);x.quadraticCurveTo((startX+targetX)/2,startY-45,targetX,targetY);x.stroke();x.strokeStyle='#444';x.lineWidth=3;x.stroke()}for(const p of particles){let sx=p.x-worldX;x.font='34px Arial';x.textAlign='center';x.fillText(p.type==='boom'?'💥':p.type==='ouch'?'💢':p.type==='shield'?'✨':p.type==='enemyhit'?'👊':'💥',sx,p.y)}if(dead)return}function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();if(!dead)requestAnimationFrame(loop)}reset()})();</script></body></html>
