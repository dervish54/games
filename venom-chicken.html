<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Venom Chicken Rush</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif;touch-action:none}#game{position:relative;width:100%;height:100%;background:linear-gradient(#17202a,#0b0f14 65%,#242424)}#hud{position:absolute;top:12px;left:12px;right:12px;z-index:5;display:grid;gap:8px}.row{display:flex;justify-content:space-between;font-weight:700;text-shadow:0 2px 3px #000}.bar{height:18px;border:2px solid #fff;border-radius:12px;overflow:hidden;background:#222}.fill{height:100%;width:0;background:linear-gradient(90deg,#60ff7b,#d7ff39)}#venom{position:absolute;width:92px;height:92px;border-radius:46% 46% 42% 42%;background:#080808;border:3px solid #333;left:45%;top:62%;transform:translate(-50%,-50%);box-shadow:0 0 20px #000}.eye{position:absolute;top:20px;width:30px;height:13px;background:#fff;clip-path:polygon(0 0,100% 30%,55% 100%)}.e1{left:10px}.e2{right:10px;transform:scaleX(-1)}.mouth{position:absolute;left:18px;right:18px;bottom:18px;height:18px;border-bottom:6px solid #fff;border-radius:50%}.tongue{position:absolute;width:12px;height:36px;background:#d52752;border-radius:8px;left:40px;bottom:-22px}.food,.enemy{position:absolute;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}.food{font-size:42px;width:56px;height:56px}.enemy{width:70px;height:70px;border-radius:50%;background:#6d1717;border:3px solid #ff5959;font-size:34px;box-shadow:0 0 14px #ff3030}.enemy.hit{transform:scale(.3);opacity:0;transition:.15s}.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:30px;font-weight:900;text-align:center;text-shadow:0 3px 6px #000;padding:30px}.panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:20}.card{background:#181818;border:2px solid #555;border-radius:18px;padding:24px;text-align:center;min-width:250px}.card button{font-size:18px;font-weight:700;padding:12px 18px;border:0;border-radius:12px;background:#e9ff42}.hint{position:absolute;bottom:12px;left:12px;right:12px;text-align:center;font-size:14px;opacity:.8}</style></head><body><div id="game"><div id="hud"><div class="row"><span>🍗 Собрано: <b id="chickens">0</b></span><span>Очки: <b id="score">0</b></span></div><div class="bar"><div class="fill" id="energy"></div></div><div class="row"><span>Энергия</span><span id="time"></span></div></div><div id="venom"><div class="eye e1"></div><div class="eye e2"></div><div class="mouth"></div><div class="tongue"></div></div><div class="msg" id="msg">Собирай курочку и заряди Венома!</div><div class="hint">Тапай или веди пальцем, чтобы Веном бежал к цели</div><div class="panel" id="panel"><div class="card"><h2>Раунд закончен!</h2><p>Уничтожено врагов: <b id="final"></b></p><button id="restart">Играть снова</button></div></div></div><script>(()=>{const g=document.getElementById('game'),v=document.getElementById('venom'),energyEl=document.getElementById('energy'),scoreEl=document.getElementById('score'),chEl=document.getElementById('chickens'),timeEl=document.getElementById('time'),msg=document.getElementById('msg'),panel=document.getElementById('panel'),final=document.getElementById('final');let x=innerWidth*.5,y=innerHeight*.68,tx=x,ty=y,energy=0,chickens=0,score=0,mode='collect',foods=[],enemies=[],spawnT=0,last=performance.now(),endAt=0;function clamp(a,b,c){return Math.max(b,Math.min(c,a))}function posVenom(){v.style.left=x+'px';v.style.top=y+'px'}function addFood(){const e=document.createElement('div');e.className='food';e.textContent='🍗';g.appendChild(e);const o={el:e,x:30+Math.random()*(innerWidth-60),y:90+Math.random()*(innerHeight-150)};e.style.left=o.x-28+'px';e.style.top=o.y-28+'px';foods.push(o)}function addEnemy(){const e=document.createElement('div');e.className='enemy';e.textContent=['👹','🤖','👾'][Math.floor(Math.random()*3)];const o={el:e,x:40+Math.random()*(innerWidth-80),y:110+Math.random()*(innerHeight-180),dead:false};e.style.left=o.x-35+'px';e.style.top=o.y-35+'px';e.addEventListener('pointerdown',ev=>{ev.stopPropagation();if(mode!=='fight'||o.dead)return;o.dead=true;score++;scoreEl.textContent=score;e.classList.add('hit');setTimeout(()=>e.remove(),150)});g.appendChild(e);enemies.push(o)}function startFight(){mode='fight';foods.forEach(f=>f.el.remove());foods=[];msg.textContent='АТАКА! Тапай врагов!';setTimeout(()=>msg.textContent='',1000);endAt=performance.now()+15000;spawnT=0}function reset(){document.querySelectorAll('.food,.enemy').forEach(e=>e.remove());foods=[];enemies=[];energy=0;chickens=0;score=0;mode='collect';x=innerWidth*.5;y=innerHeight*.68;tx=x;ty=y;energyEl.style.width='0%';scoreEl.textContent='0';chEl.textContent='0';timeEl.textContent='';msg.textContent='Собирай курочку и заряди Венома!';panel.style.display='none';addFood();addFood();last=performance.now();requestAnimationFrame(loop)}function target(ev){tx=clamp(ev.clientX,46,innerWidth-46);ty=clamp(ev.clientY,120,innerHeight-55)}g.addEventListener('pointerdown',target);g.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')target(e)});function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;const dx=tx-x,dy=ty-y,d=Math.hypot(dx,dy);if(d>4){const s=240*dt;x+=dx/d*Math.min(s,d);y+=dy/d*Math.min(s,d);posVenom()}if(mode==='collect'){for(let i=foods.length-1;i>=0;i--){const f=foods[i];if(Math.hypot(f.x-x,f.y-y)<58){f.el.remove();foods.splice(i,1);chickens++;energy=Math.min(100,energy+20);chEl.textContent=chickens;energyEl.style.width=energy+'%';addFood();if(Math.random()<.45)addFood();if(energy>=100)startFight()}}}else if(mode==='fight'){spawnT-=dt;if(spawnT<=0){addEnemy();spawnT=.32+Math.random()*.35}const remain=Math.max(0,(endAt-t)/1000);timeEl.textContent='⏱ '+remain.toFixed(1)+' c';if(remain<=0){mode='done';timeEl.textContent='';final.textContent=score;panel.style.display='flex';return}}if(mode!=='done')requestAnimationFrame(loop)}document.getElementById('restart').onclick=reset;addEventListener('resize',()=>{x=clamp(x,46,innerWidth-46);y=clamp(y,120,innerHeight-55);posVenom()});reset()})();</script></body></html>
