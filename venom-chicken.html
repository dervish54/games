<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Venom Chicken Rush</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0f14;color:#fff;font-family:Arial,sans-serif;touch-action:none}#game{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 25%,#293642,#111820 55%,#080b0e)}#hud{position:absolute;top:12px;left:12px;right:12px;z-index:20;display:grid;gap:7px}.row{display:flex;justify-content:space-between;font-weight:800;text-shadow:0 2px 4px #000}.bar{height:19px;border:2px solid #fff;border-radius:14px;overflow:hidden;background:#222}.fill{height:100%;width:0;background:linear-gradient(90deg,#4cff74,#dfff3c);transition:width .18s}.arena{position:absolute;inset:0}.city{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(#161b20,#080a0c)}.city:before{content:"";position:absolute;left:3%;right:3%;bottom:0;height:80%;background:repeating-linear-gradient(90deg,#202832 0 54px,#111820 54px 64px);clip-path:polygon(0 35%,7% 35%,7% 10%,14% 10%,14% 45%,22% 45%,22% 18%,29% 18%,29% 54%,36% 54%,36% 28%,44% 28%,44% 6%,52% 6%,52% 41%,61% 41%,61% 20%,69% 20%,69% 50%,78% 50%,78% 14%,86% 14%,86% 38%,94% 38%,94% 24%,100% 24%,100% 100%,0 100%)}#venom{position:absolute;width:96px;height:96px;border-radius:46% 46% 42% 42%;background:#070707;border:3px solid #343434;transform:translate(-50%,-50%);z-index:8;box-shadow:0 8px 18px #000}.eye{position:absolute;top:21px;width:31px;height:14px;background:#fff;clip-path:polygon(0 0,100% 30%,54% 100%)}.e1{left:10px}.e2{right:10px;transform:scaleX(-1)}.mouth{position:absolute;left:17px;right:17px;bottom:18px;height:19px;border-bottom:6px solid #fff;border-radius:50%}.tongue{position:absolute;width:12px;height:38px;background:#d52353;border-radius:8px;left:42px;bottom:-24px}.food,.enemy{position:absolute;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}.food{font-size:44px;width:58px;height:58px;z-index:4;filter:drop-shadow(0 4px 5px #000)}.enemy{width:76px;height:76px;border-radius:22px;background:linear-gradient(#7d2626,#3e0d0d);border:3px solid #ff6969;font-size:36px;z-index:7;box-shadow:0 0 18px rgba(255,40,40,.7);transition:transform .12s,opacity .15s}.enemy .hp{position:absolute;left:7px;right:7px;top:-10px;height:6px;background:#220707;border:1px solid #fff;border-radius:5px;overflow:hidden}.enemy .hp i{display:block;height:100%;background:#ff4e4e;width:100%}.enemy.hit{transform:scale(1.2)}.enemy.dead{transform:scale(.15) rotate(25deg);opacity:0}.tentacle{position:absolute;height:18px;background:linear-gradient(#121212,#000);border:2px solid #3d3d3d;border-radius:999px;transform-origin:0 50%;z-index:9;pointer-events:none;box-shadow:0 0 8px #000}.tentacle:after{content:"";position:absolute;right:-12px;top:-7px;width:28px;height:28px;border-radius:50%;background:#050505;border:2px solid #444}.boom{position:absolute;z-index:12;font-size:34px;pointer-events:none;animation:pop .35s ease-out forwards}@keyframes pop{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.8);opacity:0}}.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:31px;font-weight:900;text-align:center;text-shadow:0 3px 7px #000;padding:30px;z-index:15}.hint{position:absolute;bottom:12px;left:12px;right:12px;text-align:center;font-size:14px;opacity:.85;z-index:15}.panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.76);z-index:30}.card{background:#181818;border:2px solid #555;border-radius:18px;padding:24px;text-align:center;min-width:250px}.card button{font-size:18px;font-weight:800;padding:12px 18px;border:0;border-radius:12px;background:#e9ff42;color:#111}</style></head><body><div id="game"><div class="city"></div><div id="hud"><div class="row"><span>🍗 Собрано: <b id="chickens">0</b></span><span>Враги: <b id="score">0</b></span></div><div class="bar"><div class="fill" id="energy"></div></div><div class="row"><span id="phase">Энергия</span><span id="time"></span></div></div><div id="venom"><div class="eye e1"></div><div class="eye e2"></div><div class="mouth"></div><div class="tongue"></div></div><div class="msg" id="msg">Собирай курочку и заряди Венома!</div><div class="hint" id="hint">Тапай по экрану — Веном бежит к цели</div><div class="panel" id="panel"><div class="card"><h2>Бой окончен!</h2><p>Уничтожено врагов: <b id="final"></b></p><button id="restart">Играть снова</button></div></div></div><script>(()=>{const g=document.getElementById('game'),v=document.getElementById('venom'),energyEl=document.getElementById('energy'),scoreEl=document.getElementById('score'),chEl=document.getElementById('chickens'),timeEl=document.getElementById('time'),msg=document.getElementById('msg'),hint=document.getElementById('hint'),phase=document.getElementById('phase'),panel=document.getElementById('panel'),final=document.getElementById('final');let x=innerWidth*.5,y=innerHeight*.7,tx=x,ty=y,energy=0,chickens=0,score=0,mode='collect',foods=[],enemies=[],spawnT=0,last=performance.now(),endAt=0,raf=0;const clamp=(a,b,c)=>Math.max(b,Math.min(c,a));function posVenom(){v.style.left=x+'px';v.style.top=y+'px'}function addFood(){const e=document.createElement('div');e.className='food';e.textContent='🍗';g.appendChild(e);const o={el:e,x:34+Math.random()*(innerWidth-68),y:110+Math.random()*(innerHeight-210)};e.style.left=o.x-29+'px';e.style.top=o.y-29+'px';foods.push(o)}function addEnemy(){const e=document.createElement('div');e.className='enemy';e.innerHTML='<span>'+['👹','🤖','👾','🦹'][Math.floor(Math.random()*4)]+'</span><div class="hp"><i></i></div>';const hp=1+(Math.random()<.35?1:0),o={el:e,x:50+Math.random()*(innerWidth-100),y:125+Math.random()*(innerHeight-230),vx:(Math.random()-.5)*70,vy:(Math.random()-.5)*55,hp,maxHp:hp,dead:false,hpEl:e.querySelector('.hp i')};e.style.left=o.x-38+'px';e.style.top=o.y-38+'px';e.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();attack(o)});g.appendChild(e);enemies.push(o)}function attack(o){if(mode!=='fight'||o.dead)return;tentacleTo(o.x,o.y);o.hp--;o.hpEl.style.width=(o.hp/o.maxHp*100)+'%';o.el.classList.add('hit');setTimeout(()=>o.el.classList.remove('hit'),110);if(o.hp<=0){o.dead=true;score++;scoreEl.textContent=score;o.el.classList.add('dead');boom(o.x,o.y);setTimeout(()=>o.el.remove(),160)}}function tentacleTo(ex,ey){const dx=ex-x,dy=ey-y,len=Math.hypot(dx,dy),a=Math.atan2(dy,dx)*180/Math.PI,t=document.createElement('div');t.className='tentacle';t.style.left=x+'px';t.style.top=(y-9)+'px';t.style.width=len+'px';t.style.transform='rotate('+a+'deg) scaleX(.15)';g.appendChild(t);requestAnimationFrame(()=>{t.style.transition='transform .09s ease-out';t.style.transform='rotate('+a+'deg) scaleX(1)'});setTimeout(()=>{t.style.transition='opacity .1s,transform .1s';t.style.opacity='0';t.style.transform='rotate('+a+'deg) scaleX(.4)'},120);setTimeout(()=>t.remove(),240)}function boom(bx,by){const b=document.createElement('div');b.className='boom';b.textContent='💥';b.style.left=(bx-17)+'px';b.style.top=(by-17)+'px';g.appendChild(b);setTimeout(()=>b.remove(),380)}function startFight(){mode='fight';foods.forEach(f=>f.el.remove());foods=[];energy=100;energyEl.style.width='100%';phase.textContent='РЕЖИМ БОЯ';hint.textContent='Тапай прямо по врагам — Веном бьёт щупальцем!';msg.textContent='АТАКА! 15 СЕКУНД!';endAt=performance.now()+15000;spawnT=0;for(let i=0;i<4;i++)addEnemy();setTimeout(()=>{if(mode==='fight')msg.textContent=''},900)}function endFight(){mode='done';timeEl.textContent='';final.textContent=score;panel.style.display='flex'}function reset(){cancelAnimationFrame(raf);document.querySelectorAll('.food,.enemy,.tentacle,.boom').forEach(e=>e.remove());foods=[];enemies=[];energy=0;chickens=0;score=0;mode='collect';x=innerWidth*.5;y=innerHeight*.7;tx=x;ty=y;energyEl.style.width='0%';scoreEl.textContent='0';chEl.textContent='0';timeEl.textContent='';phase.textContent='Энергия';hint.textContent='Тапай по экрану — Веном бежит к цели';msg.textContent='Собирай курочку и заряди Венома!';panel.style.display='none';addFood();addFood();last=performance.now();posVenom();raf=requestAnimationFrame(loop)}function moveTarget(ev){if(mode!=='collect')return;tx=clamp(ev.clientX,48,innerWidth-48);ty=clamp(ev.clientY,120,innerHeight-60)}g.addEventListener('pointerdown',moveTarget);g.addEventListener('pointermove',e=>{if(mode==='collect'&&(e.buttons||e.pointerType==='touch'))moveTarget(e)});function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(mode==='collect'){const dx=tx-x,dy=ty-y,d=Math.hypot(dx,dy);if(d>4){const s=260*dt;x+=dx/d*Math.min(s,d);y+=dy/d*Math.min(s,d);posVenom()}for(let i=foods.length-1;i>=0;i--){const f=foods[i];if(Math.hypot(f.x-x,f.y-y)<60){f.el.remove();foods.splice(i,1);chickens++;energy=Math.min(100,energy+20);chEl.textContent=chickens;energyEl.style.width=energy+'%';addFood();if(Math.random()<.4)addFood();if(energy>=100){startFight();break}}}}else if(mode==='fight'){spawnT-=dt;if(spawnT<=0){addEnemy();spawnT=.42+Math.random()*.32}for(const e of enemies){if(e.dead)continue;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.x<42||e.x>innerWidth-42)e.vx*=-1;if(e.y<120||e.y>innerHeight-70)e.vy*=-1;e.x=clamp(e.x,42,innerWidth-42);e.y=clamp(e.y,120,innerHeight-70);e.el.style.left=e.x-38+'px';e.el.style.top=e.y-38+'px'}enemies=enemies.filter(e=>!e.dead&&document.body.contains(e.el));const remain=Math.max(0,(endAt-t)/1000);timeEl.textContent='⏱ '+remain.toFixed(1)+' c';if(remain<=0){endFight();return}}if(mode!=='done')raf=requestAnimationFrame(loop)}document.getElementById('restart').onclick=reset;addEventListener('resize',()=>{x=clamp(x,48,innerWidth-48);y=clamp(y,120,innerHeight-60);posVenom()});reset()})();</script></body></html>
